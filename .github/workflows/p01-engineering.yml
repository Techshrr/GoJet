name: P01 Engineering Foundation

on:
  push:
    branches:
      - develop/p01-engineering-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: P01 required engineering tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Compile P01 validator
        run: python3 -m py_compile scripts/p01/validate.py
      - name: Run P01 required tests
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/p01/validate.py
      - name: Upload P01 and G1 engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p01-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/v10/P01/environment.json
            artifacts/v10/P01/source.json
            artifacts/v10/P01/commands.log
            artifacts/v10/P01/test-plan.json
            artifacts/v10/P01/evidence-index.json
            artifacts/v10/P01/review.md
            artifacts/v10/P01/results/
            artifacts/v10/P01/build-logs/
            artifacts/v10/P01/bundle-report.json
            artifacts/v10/P01/dependency-report.json
            artifacts/v10/gates/G1/native-architecture/p01-engineering.json
