name: P01 Lockfile Bootstrap

on:
  push:
    branches:
      - develop/p01-engineering-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm --version
      - name: Generate lockfile only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile to development branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build(p01): lock frontend dependencies'
          git push origin HEAD:develop/p01-engineering-foundation
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: p01-pnpm-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
