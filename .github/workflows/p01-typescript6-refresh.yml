name: P01 TypeScript 6 Compatibility Refresh

on:
  push:
    branches:
      - develop/p01-engineering-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/p01-engineering-foundation
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
      - name: Pin Astro-compatible TypeScript 6.0.3 and refresh lockfile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('package.json'),
              Path('frontend/apps/site/package.json'),
              Path('frontend/apps/workspace/package.json'),
              Path('frontend/apps/admin/package.json'),
              Path('frontend/apps/docs/package.json'),
              Path('scripts/p01/validate.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('7.0.2', '6.0.3')
              path.write_text(text, encoding='utf-8')
          PY
          pnpm install --lockfile-only
      - name: Commit compatibility lock refresh
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'TypeScript 6 compatibility refresh already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json frontend/apps/*/package.json scripts/p01/validate.py pnpm-lock.yaml
          git commit -m 'fix(p01): pin Astro-compatible TypeScript 6.0.3'
          git push origin HEAD:develop/p01-engineering-foundation
