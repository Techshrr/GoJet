name: P03 Canonical Token Bootstrap

on:
  push:
    branches:
      - develop/p03-design-system
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/p03-design-system
          fetch-depth: 1
      - name: Extract approved token tables
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p03/extract_tokens.py scripts/p03/generate_tokens.py
          python3 scripts/p03/extract_tokens.py
          python3 scripts/p03/generate_tokens.py
      - name: Commit canonical and generated token artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/packages/tokens/src/tokens.json frontend/packages/tokens/generated/
          if git diff --cached --quiet; then
            echo 'Token artifacts are already synchronized.'
            exit 0
          fi
          git commit -m 'P03: bootstrap canonical Design System tokens'
          git push origin HEAD:develop/p03-design-system
