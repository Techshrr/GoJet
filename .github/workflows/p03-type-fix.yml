name: P03 Exact Optional Props Fix

on:
  push:
    branches:
      - develop/p03-design-system
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/p03-design-system
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Fix exact optional FieldStatus contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/packages/ui/src/components.tsx')
          s=p.read_text(encoding='utf-8')
          old="function FieldStatus({ id, error, success }: Pick<FieldMeta, 'id' | 'error' | 'success'>) {"
          new="function FieldStatus({ id, error, success }: { id: string; error?: string | undefined; success?: string | undefined }) {"
          if old not in s:
              raise SystemExit('FieldStatus signature not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:packages
      - name: Commit strict typing correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/packages/ui/src/components.tsx
          git commit -m 'fix(p03): satisfy exact optional component props'
          git push origin HEAD:develop/p03-design-system
