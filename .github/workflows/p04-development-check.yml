name: P04 Development Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  development-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install current workspace graph
        run: |
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm install --no-frozen-lockfile
      - name: Strict package typecheck
        run: pnpm run typecheck:packages
      - name: Strict app typecheck
        run: pnpm run typecheck:apps
      - name: PHP installer syntax
        run: |
          php -l installer/src/Shell.php
          php -l installer/public/index.php
      - name: P03 token lint regression
        run: python3 scripts/p03/validate.py --case P03-T003
