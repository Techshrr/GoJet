name: P04 Docs Lock Refresh Once

on:
  push:
    branches:
      - develop/p04-product-shells
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout P04 branch
        uses: actions/checkout@v4
        with:
          ref: develop/p04-product-shells
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Refresh and verify Docs lockfile
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm run typecheck:packages
          pnpm run typecheck:apps
          pnpm run build:apps
      - name: Commit lockfile and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/p04-docs-lock-refresh-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/p04-docs-lock-refresh-once.yml
          git commit -m 'build(p04): lock Astro Docs verification dependency'
          git push origin HEAD:develop/p04-product-shells
