name: P04 Topology Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P04 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Normalize scoped workspace subpath imports in working tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p01/validate.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == 'for dep in imports:' and i > 0 and 'imports = re.findall' in lines[i - 1]]
          if len(matches) != 1:
              raise SystemExit(f'Expected one P01 workspace import loop, found {len(matches)}')
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          replacement = [
              f'{indent}for imported in imports:',
              f'{indent}    parts = imported.split("/")',
              f'{indent}    dep = "/".join(parts[:2]) if len(parts) >= 2 else imported',
              f'{indent}    if dep not in declared:',
              f'{indent}        errors.append(f"{{source.relative_to(ROOT)}} imports undeclared workspace dependency {{imported}}")',
              f'{indent}    if name in PACKAGES and dep in APPS:',
              f'{indent}        errors.append(f"shared package {{name}} imports app {{dep}}")',
          ]
          lines[i:i + 5] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile scripts/p01/validate.py scripts/p04/validate.py
      - name: Refresh dependency graph in working tree
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Verify clean Design System source
        run: |
          set -euo pipefail
          pnpm run typecheck:packages
          python3 scripts/p03/validate.py --case P03-T003
      - name: Verify application architecture
        run: |
          set -euo pipefail
          pnpm run typecheck:apps
          python3 scripts/p01/validate.py --case P01-T004
      - name: Verify production builds and native installer syntax
        run: |
          set -euo pipefail
          pnpm run build:apps
          php -l installer/src/Shell.php
          php -l installer/public/index.php
      - name: Stage proposed persistent files
        run: |
          mkdir -p artifacts/v10/P04/topology-fix
          cp scripts/p01/validate.py artifacts/v10/P04/topology-fix/p01-validate.py
          cp pnpm-lock.yaml artifacts/v10/P04/topology-fix/pnpm-lock.yaml
          git diff -- scripts/p01/validate.py pnpm-lock.yaml > artifacts/v10/P04/topology-fix/proposed.patch
      - name: Upload verified topology fix
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p04-topology-fix-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/v10/P04/topology-fix/
