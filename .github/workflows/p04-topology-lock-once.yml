name: P04 Persist Verified Topology Fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout P04 branch
        uses: actions/checkout@v4
        with:
          ref: develop/p04-product-shells
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Reproduce verified P01 validator patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p01/validate.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == 'for dep in imports:' and i > 0 and 'imports = re.findall' in lines[i - 1]]
          if len(matches) != 1:
              raise SystemExit(f'Expected one P01 workspace import loop, found {len(matches)}')
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          replacement = [
              f'{indent}for imported in imports:',
              f'{indent}    parts = imported.split("/")',
              f'{indent}    dep = "/".join(parts[:2]) if len(parts) >= 2 else imported',
              f'{indent}    if dep not in declared:',
              f'{indent}        errors.append(f"{{source.relative_to(ROOT)}} imports undeclared workspace dependency {{imported}}")',
              f'{indent}    if name in PACKAGES and dep in APPS:',
              f'{indent}        errors.append(f"shared package {{name}} imports app {{dep}}")',
          ]
          lines[i:i + 5] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Reproduce verified lockfile
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          pnpm install --lockfile-only
      - name: Require byte-identical verified outputs
        run: |
          set -euo pipefail
          printf '%s  %s\n' '1b7d878111088d0ac08f28732360d943c5c32a0ffd7e82253188ee7b7f4bdc2b' 'scripts/p01/validate.py' | sha256sum -c -
          printf '%s  %s\n' '3dcd819e3d33206b588aec2239b6d7392d9f4caa108d2806273350156273a1f5' 'pnpm-lock.yaml' | sha256sum -c -
      - name: Commit verified outputs and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/p04-topology-lock-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/p01/validate.py pnpm-lock.yaml .github/workflows/p04-topology-lock-once.yml
          git commit -m 'build(p04): restore frozen workspace topology'
          git push origin HEAD:develop/p04-product-shells
