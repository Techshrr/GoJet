name: P05 Finalize Password Evidence

on:
  push:
    branches:
      - develop/p05-links-vertical-slice

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/p05-links-vertical-slice
          fetch-depth: 1
      - name: Finalize password evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          integration = Path('scripts/p05/integration.py')
          text = integration.read_text(encoding='utf-8')
          old = '        access={"password_hash": "test-only-non-secret-hash"},\n'
          new = '        access={"password": "P05-Ordering-Password-2026!"},\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy T010 access fixture, found {text.count(old)}')
          integration.write_text(text.replace(old, new), encoding='utf-8')

          browser = Path('scripts/p05/password_browser.mjs')
          text = browser.read_text(encoding='utf-8')
          old = '''    await page.getByLabel('Password').fill(PASSWORD_TWO);\n    const correctResponsePromise = page.waitForResponse((response) =>\n      response.request().method() === 'POST' && new URL(response.url()).pathname === `/${CODE}`);\n    await page.getByRole('button', { name: 'Continue' }).click();\n    const correctResponse = await correctResponsePromise;\n    assert(correctResponse.status() === 302, `replacement password returned ${correctResponse.status()} instead of 302`);\n    assert(correctResponse.headers().location === DESTINATION, `password redirect Location mismatch: ${correctResponse.headers().location}`);\n    await page.waitForURL((url) => url.origin === new URL(WORKSPACE_URL).origin && url.pathname === '/app/links');\n'''
          new = '''    await page.getByLabel('Password').fill(PASSWORD_TWO);\n    const destinationRequestPromise = page.waitForRequest((request) =>\n      request.isNavigationRequest() && request.url() === DESTINATION);\n    await page.getByRole('button', { name: 'Continue' }).click();\n    const destinationRequest = await destinationRequestPromise;\n    await page.waitForURL((url) => url.origin === new URL(WORKSPACE_URL).origin && url.pathname === '/app/links');\n    const passwordPostRequest = destinationRequest.redirectedFrom();\n    assert(passwordPostRequest, 'successful destination navigation has no redirect source request');\n    assert(passwordPostRequest.method() === 'POST', `password redirect source method was ${passwordPostRequest.method()}`);\n    assert(new URL(passwordPostRequest.url()).pathname === `/${CODE}`, `password redirect source URL was ${passwordPostRequest.url()}`);\n    const correctResponse = await passwordPostRequest.response();\n    assert(correctResponse, 'password POST redirect response is unavailable from redirect chain');\n    assert(correctResponse.status() === 302, `replacement password returned ${correctResponse.status()} instead of 302`);\n    assert(correctResponse.headers().location === DESTINATION, `password redirect Location mismatch: ${correctResponse.headers().location}`);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one intermediate 302 wait block, found {text.count(old)}')
          browser.write_text(text.replace(old, new), encoding='utf-8')

          plan_path = Path('artifacts/v10/P05/test-plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          plan['closure_contract'] = {
              'version': 1,
              'aggregator_workflow': 'P05 Closure',
              'validator': 'scripts/p05/validate.py',
              'same_exact_head_required': True,
              'required_workflows': [
                  'P00 Bootstrap and G0 Traceability',
                  'P01 Engineering Foundation',
                  'P02 Brand Foundation',
                  'P03 Design System',
                  'P04 Product Shells',
                  'P05 Links Domain Contract',
                  'P05 Real Integration',
                  'P05 Workspace Browser',
              ],
              'required_case_range': 'P05-T001..P05-T020',
          }
          plan_path.write_text(json.dumps(plan, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/p05-finalize-password-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/p05/integration.py scripts/p05/password_browser.mjs artifacts/v10/P05/test-plan.json .github/workflows/p05-finalize-password-evidence.yml
          git diff --cached --check
          git commit -m 'test(p05): finalize password and closure evidence'
          git push origin HEAD:develop/p05-links-vertical-slice
