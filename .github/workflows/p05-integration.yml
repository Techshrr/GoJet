name: P05 Real Integration

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/links/**'
      - 'services/platformapi/**'
      - 'services/redirectengine/**'
      - 'migrations/000001_links_vertical_slice.sql'
      - 'scripts/p05/integration.py'
      - 'scripts/p05/password_evidence.py'
      - 'artifacts/v10/P05/test-plan.json'
      - '.github/workflows/p05-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-integration:
    name: P05 real MySQL Redis API redirect tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_TEST_ROUTING_HEADERS: '1'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_REDIRECTENGINE_ADDR: 127.0.0.1:18080
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_REDIS_HOST: 127.0.0.1
      GOJET_TEST_REDIS_PORT: '6379'
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081
      GOJET_TEST_REDIRECT_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false

      - name: Install integration clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools
          mysql --version
          redis-cli --version

      - name: Verify dependency closure and integration drivers
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          python3 -m py_compile scripts/p05/integration.py scripts/p05/password_evidence.py

      - name: Build native P05 service binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet-p05 artifacts/v10/P05/runtime
          go build -trimpath -o /tmp/gojet-p05/platformapi ./services/platformapi/cmd/server
          go build -trimpath -o /tmp/gojet-p05/redirectengine ./services/redirectengine/cmd/server
          file /tmp/gojet-p05/platformapi /tmp/gojet-p05/redirectengine

      - name: Start native P05 services
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gojet-p05/platformapi > artifacts/v10/P05/runtime/platformapi.log 2>&1 &
          echo $! > artifacts/v10/P05/runtime/platformapi.pid
          /tmp/gojet-p05/redirectengine > artifacts/v10/P05/runtime/redirectengine.log 2>&1 &
          echo $! > artifacts/v10/P05/runtime/redirectengine.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo 'P05 services did not become healthy' >&2
          cat artifacts/v10/P05/runtime/platformapi.log || true
          cat artifacts/v10/P05/runtime/redirectengine.log || true
          exit 1

      - name: Run P05-T001 through P05-T016 against real dependencies
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          GITHUB_SHA="$exact_head" python3 scripts/p05/integration.py --case all
          GITHUB_SHA="$exact_head" python3 scripts/p05/password_evidence.py
          EXACT_HEAD="$exact_head" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          head = os.environ["EXACT_HEAD"]
          root = Path("artifacts/v10/P05/results")
          errors = []
          for number in range(1, 17):
              case_id = f"P05-T{number:03d}"
              path = root / f"{case_id}.json"
              if not path.is_file():
                  errors.append(f"missing {path}")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("implementation_commit") != head:
                  errors.append(f"{case_id} implementation_commit={data.get('implementation_commit')} expected={head}")
              if data.get("status") != "PASS":
                  errors.append(f"{case_id} status={data.get('status')} expected=PASS")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"P05-T001..T016 evidence PASS and bound to exact head {head}")
          PY

      - name: Capture final MySQL Redis and process evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/v10/P05/runtime
          MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test \
            -e "SELECT id,workspace_id,hostname,code,status,version,risk_fingerprint,click_count FROM links ORDER BY id" \
            > artifacts/v10/P05/runtime/mysql-links.tsv 2> artifacts/v10/P05/runtime/mysql-snapshot.err
          redis-cli -h 127.0.0.1 -p 6379 --raw KEYS 'risk:link:*' | sort > artifacts/v10/P05/runtime/redis-risk-keys.txt
          redis-cli -h 127.0.0.1 -p 6379 --raw KEYS 'access:password:*' | sort > artifacts/v10/P05/runtime/redis-password-attempt-keys.txt
          sha256sum /tmp/gojet-p05/platformapi /tmp/gojet-p05/redirectengine > artifacts/v10/P05/runtime/native-binaries.sha256 2>/dev/null
          ps -o pid=,comm= -p "$(cat artifacts/v10/P05/runtime/platformapi.pid 2>/dev/null)" "$(cat artifacts/v10/P05/runtime/redirectengine.pid 2>/dev/null)" > artifacts/v10/P05/runtime/processes.txt 2>/dev/null
          true

      - name: Stop native P05 services
        if: always()
        shell: bash
        run: |
          set +e
          kill "$(cat artifacts/v10/P05/runtime/platformapi.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat artifacts/v10/P05/runtime/redirectengine.pid 2>/dev/null)" 2>/dev/null || true
          true

      - name: Upload P05 real integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p05-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v10/P05/results/P05-T001.json
            artifacts/v10/P05/results/P05-T002.json
            artifacts/v10/P05/results/P05-T003.json
            artifacts/v10/P05/results/P05-T004.json
            artifacts/v10/P05/results/P05-T005.json
            artifacts/v10/P05/results/P05-T006.json
            artifacts/v10/P05/results/P05-T007.json
            artifacts/v10/P05/results/P05-T008.json
            artifacts/v10/P05/results/P05-T009.json
            artifacts/v10/P05/results/P05-T010.json
            artifacts/v10/P05/results/P05-T011.json
            artifacts/v10/P05/results/P05-T012.json
            artifacts/v10/P05/results/P05-T013.json
            artifacts/v10/P05/results/P05-T014.json
            artifacts/v10/P05/results/P05-T015.json
            artifacts/v10/P05/results/P05-T016.json
            artifacts/v10/P05/runtime/
          if-no-files-found: warn
          retention-days: 30
