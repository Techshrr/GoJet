name: P05 Password CSP Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p05-password-csp-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    if: github.event_name == 'pull_request' && github.head_ref == 'develop/p05-links-vertical-slice'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P05 branch
        uses: actions/checkout@v4
        with:
          ref: develop/p05-links-vertical-slice
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch product and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          redirect = Path('internal/links/redirect_http.go')
          text = redirect.read_text(encoding='utf-8')
          old = "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
          new = "default-src 'none'; style-src 'unsafe-inline'; form-action 'self' http: https:; base-uri 'none'; frame-ancestors 'none'"
          if old not in text:
              raise SystemExit('password challenge CSP source pattern not found')
          redirect.write_text(text.replace(old, new, 1), encoding='utf-8')

          browser = Path('scripts/p05/password_browser.mjs')
          text = browser.read_text(encoding='utf-8')
          old = "assert(challengeCsp.includes(\"default-src 'none'\") && challengeCsp.includes(\"form-action 'self'\"), `password challenge CSP invalid: ${challengeCsp}`);"
          new = "assert(challengeCsp.includes(\"default-src 'none'\") && challengeCsp.includes(\"form-action 'self' http: https:\"), `password challenge CSP invalid: ${challengeCsp}`);"
          if old not in text:
              raise SystemExit('password browser CSP assertion pattern not found')
          text = text.replace(old, new, 1)
          old_detail = "      csp_form_action_self: true,\n      correct_password_location: correctResponse.headers().location,"
          new_detail = "      csp_form_action_self: true,\n      csp_form_action_http_https: true,\n      correct_password_location: correctResponse.headers().location,"
          if old_detail not in text:
              raise SystemExit('password browser detail pattern not found')
          browser.write_text(text.replace(old_detail, new_detail, 1), encoding='utf-8')

          validator = Path('scripts/p05/validate.py')
          text = validator.read_text(encoding='utf-8')
          old = '            "csp_form_action_self": True,\n            "clear_removed_public_challenge": True,'
          new = '            "csp_form_action_self": True,\n            "csp_form_action_http_https": True,\n            "clear_removed_public_challenge": True,'
          if old not in text:
              raise SystemExit('T020 CSP expectation pattern not found')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          plan = Path('artifacts/v10/P05/test-plan.json')
          text = plan.read_text(encoding='utf-8')
          old = '"oracle": "review/block/missing and password challenge/wrong-password states never expose the destination or bypass links; successful password follows the configured 3xx and clearing protection removes the challenge",'
          new = '"oracle": "review/block/missing and password challenge/wrong-password states never expose the destination or bypass links; password CSP permits only self plus HTTP(S) redirect chains; successful password follows the configured 3xx and clearing protection removes the challenge",'
          if old not in text:
              raise SystemExit('T019 test-plan oracle pattern not found')
          plan.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/p05-password-csp-fix.yml
          git diff --check

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/links/redirect_http.go scripts/p05/password_browser.mjs scripts/p05/validate.py artifacts/v10/P05/test-plan.json .github/workflows/p05-password-csp-fix.yml
          git commit -m 'fix(p05): allow HTTP(S) password redirect chains under CSP'
          git push origin HEAD:develop/p05-links-vertical-slice
