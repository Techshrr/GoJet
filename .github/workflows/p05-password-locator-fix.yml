name: P05 Password Locator Fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    if: github.event_name == 'pull_request' && github.head_ref == 'develop/p05-links-vertical-slice'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P05 branch
        uses: actions/checkout@v4
        with:
          ref: develop/p05-links-vertical-slice
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch exact accessible password locator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/p05/password_browser.mjs')
          text = path.read_text(encoding='utf-8')
          old = "page.getByLabel('Password')"
          new = "page.getByRole('textbox', { name: 'Password', exact: true })"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 password label locators, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/p05/password_browser.mjs
          rm .github/workflows/p05-password-locator-fix.yml
          git diff --check

      - name: Commit evidence locator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/p05/password_browser.mjs .github/workflows/p05-password-locator-fix.yml
          git commit -m 'test(p05): use exact accessible password textbox locator'
          git push origin HEAD:develop/p05-links-vertical-slice
