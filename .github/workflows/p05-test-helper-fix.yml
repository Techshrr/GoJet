name: P05 Test Helper Fix

on:
  push:
    branches:
      - develop/p05-links-vertical-slice

permissions:
  contents: write

jobs:
  patch-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/p05-links-vertical-slice
          fetch-depth: 1
      - name: Patch strict access input helper and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p05/integration.py')
          text = path.read_text(encoding='utf-8')
          old = '        "access": link.get("access") or {},\n'
          new = '        "access": {},\n'
          if old not in text:
              raise SystemExit('expected integration helper access echo not found')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one access echo, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/p05-test-helper-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/p05/integration.py .github/workflows/p05-test-helper-fix.yml
          git diff --cached --check
          git commit -m 'test(p05): keep access mutations input-only'
          git push origin HEAD:develop/p05-links-vertical-slice
