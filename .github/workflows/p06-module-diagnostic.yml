name: P06 Module Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'pull_request' && github.head_ref == 'develop/p06-custom-domains'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve exact P06 module graph
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify
          go test ./internal/domains
          go vet ./internal/domains
          grep -F 'golang.org/x/net v0.58.0' go.mod
          mkdir -p artifacts/v10/P06/module-diagnostic
          cp go.mod go.sum artifacts/v10/P06/module-diagnostic/
          sha256sum go.mod go.sum > artifacts/v10/P06/module-diagnostic/files.sha256
          go list -m all > artifacts/v10/P06/module-diagnostic/module-list.txt

      - name: Upload resolved module graph
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p06-module-diagnostic-${{ github.event.pull_request.head.sha }}
          path: artifacts/v10/P06/module-diagnostic/
          if-no-files-found: error
          retention-days: 7
