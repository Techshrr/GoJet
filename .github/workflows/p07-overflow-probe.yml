name: P07 Overflow Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/**'
      - 'internal/analytics/**'
      - 'internal/links/**'
      - 'services/platformapi/**'
      - 'migrations/**'
      - 'scripts/p07/overflow_probe.mjs'
      - '.github/workflows/p07-overflow-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: P07 Link analytics overflow probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_ANALYTICS_ENABLED: '1'
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081
      GOJET_TEST_WORKSPACE_URL: http://127.0.0.1:4174
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_PLATFORMAPI_PROXY: http://127.0.0.1:18081
      VITE_GOJET_TEST_AUTH_ENABLED: '1'
      VITE_GOJET_TEST_WORKSPACE_ID: ws-p07-overflow-probe
      VITE_GOJET_TEST_ACTOR_ID: p07-overflow-probe
      VITE_GOJET_TEST_WORKSPACE_ROLE: owner
      VITE_GOJET_TEST_ANALYTICS_PERMISSION: allow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          check-latest: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Activate pnpm and install clients
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client
          pnpm install --frozen-lockfile
      - name: Apply migrations and build
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000001_links_vertical_slice.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000002_custom_domains.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000003_analytics.sql
          mkdir -p /tmp/gojet-p07-probe artifacts/v10/P07/overflow-probe
          go build -trimpath -o /tmp/gojet-p07-probe/platformapi ./services/platformapi/cmd/server
          pnpm --filter @gojet/workspace build
      - name: Start API and Workspace
        run: |
          set -euo pipefail
          /tmp/gojet-p07-probe/platformapi > /tmp/p07-probe-platform.log 2>&1 &
          echo $! > /tmp/p07-probe-platform.pid
          nohup pnpm --filter @gojet/workspace exec vite preview --host 127.0.0.1 --port 4174 > /tmp/p07-probe-workspace.log 2>&1 &
          echo $! > /tmp/p07-probe-workspace.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null && curl -fsS http://127.0.0.1:4174/app/analytics >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p07-probe-platform.log /tmp/p07-probe-workspace.log || true
          exit 1
      - name: Probe overflow
        run: node scripts/p07/overflow_probe.mjs
      - name: Stop services
        if: always()
        run: |
          set +e
          kill "$(cat /tmp/p07-probe-workspace.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/p07-probe-platform.pid 2>/dev/null)" 2>/dev/null || true
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p07-overflow-probe-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: artifacts/v10/P07/overflow-probe/
