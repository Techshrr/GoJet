name: P08 Real QR Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/qr/**'
      - 'internal/links/**'
      - 'internal/domains/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'services/redirectengine/**'
      - 'scripts/p08/**'
      - 'artifacts/v10/P08/**'
      - '.github/workflows/p08-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p08-real-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-integration:
    name: P08 real MySQL Redis QR and scanner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_TEST_ROUTING_HEADERS: '1'
      GOJET_ANALYTICS_ENABLED: '0'
      GOJET_QR_WORKSPACE_QUOTA: '2'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_REDIRECTENGINE_ADDR: 127.0.0.1:18080
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_REDIS_HOST: 127.0.0.1
      GOJET_TEST_REDIS_PORT: '6379'
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081
      GOJET_TEST_REDIRECT_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install integration and scanner clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools zbar-tools librsvg2-bin
          mysql --version
          redis-cli --version
          zbarimg --version
          rsvg-convert --version

      - name: Verify dependency closure and P08 drivers
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          python3 -m py_compile scripts/p08/integration.py scripts/p08/validate_contract.py
          gofmt -d scripts/p08/scanner_driver/main.go | tee /tmp/p08-scanner-gofmt.diff
          test ! -s /tmp/p08-scanner-gofmt.diff
          go test ./internal/qr ./internal/links ./internal/domains
          go vet ./internal/qr ./internal/links ./internal/domains ./services/platformapi/cmd/server ./services/redirectengine/cmd/server ./scripts/p08/scanner_driver

      - name: Apply P05 through P08 migrations
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000001_links_vertical_slice.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000002_custom_domains.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000003_analytics.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < migrations/000004_qr.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SHOW TABLES LIKE 'qr_%'" | sort

      - name: Build native P08 services and scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet-p08 artifacts/v10/P08/runtime artifacts/v10/P08/results artifacts/v10/P08/scanner
          go build -trimpath -o /tmp/gojet-p08/platformapi ./services/platformapi/cmd/server
          go build -trimpath -o /tmp/gojet-p08/redirectengine ./services/redirectengine/cmd/server
          go build -trimpath -o /tmp/gojet-p08/scanner ./scripts/p08/scanner_driver
          file /tmp/gojet-p08/platformapi /tmp/gojet-p08/redirectengine /tmp/gojet-p08/scanner
          sha256sum /tmp/gojet-p08/platformapi /tmp/gojet-p08/redirectengine /tmp/gojet-p08/scanner > artifacts/v10/P08/runtime/native-binaries.sha256

      - name: Start native platform and redirect services
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gojet-p08/platformapi > artifacts/v10/P08/runtime/platformapi.log 2>&1 &
          echo $! > artifacts/v10/P08/runtime/platformapi.pid
          /tmp/gojet-p08/redirectengine > artifacts/v10/P08/runtime/redirectengine.log 2>&1 &
          echo $! > artifacts/v10/P08/runtime/redirectengine.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo 'P08 platform/redirect services did not become healthy' >&2
          cat artifacts/v10/P08/runtime/platformapi.log || true
          cat artifacts/v10/P08/runtime/redirectengine.log || true
          exit 1

      - name: Run P08-T001 and independent scanner P08-T003
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          GITHUB_SHA="$exact_head" python3 scripts/p08/integration.py --case P08-T001
          GITHUB_SHA="$exact_head" go run ./scripts/p08/scanner_driver --case P08-T003

      - name: Run P08-T002 and P08-T004 through P08-T009
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          for case_id in P08-T002 P08-T004 P08-T005 P08-T006 P08-T007 P08-T008 P08-T009; do
            GITHUB_SHA="$exact_head" python3 scripts/p08/integration.py --case "$case_id"
          done

      - name: Run P08-T010 dependency failure last
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          GITHUB_SHA="$exact_head" python3 scripts/p08/integration.py --case P08-T010

      - name: Verify exact-head P08-T001 through P08-T010 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          EXACT_HEAD="$exact_head" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          head = os.environ["EXACT_HEAD"]
          root = Path("artifacts/v10/P08")
          expected = [f"P08-T{number:03d}" for number in range(1, 11)]
          errors = []
          for case_id in expected:
              path = root / ("scanner" if case_id == "P08-T003" else "results") / f"{case_id}.json"
              if not path.is_file():
                  errors.append(f"missing {path}")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("implementation_commit") != head:
                  errors.append(f"{case_id} implementation_commit={data.get('implementation_commit')} expected={head}")
              if data.get("status") != "PASS":
                  errors.append(f"{case_id} status={data.get('status')}")
              if data.get("errors") != []:
                  errors.append(f"{case_id} errors={data.get('errors')}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"P08-T001..T010 exact-head evidence PASS on {head}")
          PY

      - name: Capture P08 runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/v10/P08/runtime
          export MYSQL_PWD=root
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test \
            -e "SELECT id,workspace_id,source_link_id,label,created_by,created_at,updated_at,deleted_at FROM qr_codes ORDER BY id" \
            > artifacts/v10/P08/runtime/mysql-qr-codes.tsv 2> artifacts/v10/P08/runtime/mysql-qr-codes.err
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test \
            -e "SELECT workspace_id,active_count,updated_at FROM qr_workspace_counters ORDER BY workspace_id" \
            > artifacts/v10/P08/runtime/mysql-qr-counters.tsv 2> artifacts/v10/P08/runtime/mysql-qr-counters.err
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test \
            -e "SELECT id,workspace_id,qr_id,source_link_id,actor_id,action,request_correlation_id,result,created_at FROM qr_audit_events ORDER BY id" \
            > artifacts/v10/P08/runtime/mysql-qr-audit.tsv 2> artifacts/v10/P08/runtime/mysql-qr-audit.err
          redis-cli -h 127.0.0.1 -p 6379 --raw DBSIZE > artifacts/v10/P08/runtime/redis-dbsize.txt 2>&1 || true
          ps -o pid=,comm= -p "$(cat artifacts/v10/P08/runtime/platformapi.pid 2>/dev/null)" "$(cat artifacts/v10/P08/runtime/redirectengine.pid 2>/dev/null)" > artifacts/v10/P08/runtime/processes.txt 2>/dev/null || true
          true

      - name: Stop native P08 services
        if: always()
        shell: bash
        run: |
          set +e
          kill "$(cat artifacts/v10/P08/runtime/platformapi.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat artifacts/v10/P08/runtime/redirectengine.pid 2>/dev/null)" 2>/dev/null || true
          true

      - name: Upload P08 real integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p08-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v10/P08/results/P08-T001.json
            artifacts/v10/P08/results/P08-T002.json
            artifacts/v10/P08/scanner/P08-T003.json
            artifacts/v10/P08/scanner/P08-T003-source.png
            artifacts/v10/P08/scanner/P08-T003-source.svg
            artifacts/v10/P08/scanner/P08-T003-source-from-svg.png
            artifacts/v10/P08/scanner/P08-T003-expected.json
            artifacts/v10/P08/results/P08-T004.json
            artifacts/v10/P08/results/P08-T005.json
            artifacts/v10/P08/results/P08-T006.json
            artifacts/v10/P08/results/P08-T007.json
            artifacts/v10/P08/results/P08-T008.json
            artifacts/v10/P08/results/P08-T009.json
            artifacts/v10/P08/results/P08-T010.json
            artifacts/v10/P08/runtime/
          if-no-files-found: warn
          retention-days: 30
