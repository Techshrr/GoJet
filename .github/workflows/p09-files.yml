name: P09 Files Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/v10/P09/**'
      - 'scripts/p09/**'
      - '.github/workflows/p09-*.yml'
      - 'internal/files/**'
      - 'internal/storage/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/apps/admin/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
      - 'installer/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p09-files-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: P09 contract freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile P09 contract validator
        run: python3 -m py_compile scripts/p09/validate_contract.py

      - name: Validate frozen P09 contract
        run: python3 scripts/p09/validate_contract.py | tee /tmp/p09-contract.json

      - name: Preserve current native compile and unit boundary
        run: go test ./...

      - name: Record exact-head contract evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p09-contract-evidence
          cp /tmp/p09-contract.json /tmp/p09-contract-evidence/contract.json 2>/dev/null || true
          git rev-parse HEAD > /tmp/p09-contract-evidence/implementation_commit.txt
          printf '%s\n' '418277613cf4336273b19f5d0da8a47bc1d403d6' > /tmp/p09-contract-evidence/base_integration_commit.txt
          printf '%s\n' 'P09-T001..P09-T027' > /tmp/p09-contract-evidence/case_range.txt
          printf '%s\n' 'CAP-FILES P09/P17 G3/G6/G10' > /tmp/p09-contract-evidence/capabilities.txt
          printf '%s\n' 'CAP-CLAMAV-REQUIRED P09/P22 G6/G12/G13' >> /tmp/p09-contract-evidence/capabilities.txt
          printf '%s\n' 'Workspace exact HTTP family is P09 implementation authority; IA freezes semantic fileshare/file-delete dependencies only.' > /tmp/p09-contract-evidence/api-authority.txt

      - name: Upload P09 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-files-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/p09-contract-evidence
          if-no-files-found: error
          retention-days: 14
