name: P09 Files Health and Installer Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/files/**'
      - 'installer/**'
      - 'services/platformapi/cmd/server/**'
      - 'services/platformapi/cmd/filepreflight/**'
      - 'scripts/p09/**'
      - '.github/workflows/p09-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p09-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health-preflight:
    name: P09 installer and admin Files health tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_ANALYTICS_ENABLED: '0'
      GOJET_QR_WORKSPACE_QUOTA: '2'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_FILES_ENABLED: '1'
      GOJET_FILE_WORKSPACE_MAX_FILES: '2'
      GOJET_FILE_WORKSPACE_MAX_BYTES: '1048576'
      GOJET_FILE_MAX_UPLOAD_BYTES: '65536'
      GOJET_FILE_STORAGE_ROOT: /tmp/gojet-p09/storage
      GOJET_FILE_TYPE_ALLOWLIST: txt=text/plain
      GOJET_FILE_PUBLIC_AUTH_SECRET: p09-health-only-secret-0123456789abcdef
      GOJET_CLAMAV_NETWORK: tcp
      GOJET_CLAMAV_ADDRESS: 127.0.0.1:3310
      GOJET_CLAMAV_DIAL_TIMEOUT: 500ms
      GOJET_CLAMAV_SCAN_TIMEOUT: 5s
      GOJET_CLAMAV_MAX_SIGNATURE_AGE: 72h
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081
      GOJET_P09_FILEPREFLIGHT: /tmp/gojet-p09/filepreflight
      GOJET_P09_INSTALLER_INDEX: installer/public/index.php
      GOJET_P09_REAL_CLAMD_ADDRESS: 127.0.0.1:3310
      GOJET_P09_FAULT_SERVER: scripts/p09/clamd_fault_server.py

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            default-mysql-client redis-tools clamav clamav-daemon clamav-freshclam php8.3-cli
          mysql --version
          redis-cli --version
          clamd --version
          php --version | head -1

      - name: Refresh signatures and start native clamd
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet-p09 artifacts/v10/P09/runtime artifacts/v10/P09/results artifacts/v10/P09/clamav
          sudo systemctl stop clamav-freshclam.service clamav-daemon.service clamav-daemon.socket 2>/dev/null || true
          sudo freshclam --stdout 2>&1 | tee artifacts/v10/P09/clamav/health-freshclam.log
          cat > /tmp/gojet-p09/clamd-health.conf <<'EOF'
          Foreground true
          TCPSocket 3310
          TCPAddr 127.0.0.1
          DatabaseDirectory /var/lib/clamav
          LogTime true
          LogFile /tmp/gojet-p09/clamd-health.log
          PidFile /tmp/gojet-p09/clamd-health.pid
          MaxFileSize 100M
          MaxScanSize 100M
          StreamMaxLength 100M
          EOF
          clamd --config-file=/tmp/gojet-p09/clamd-health.conf > artifacts/v10/P09/clamav/health-clamd-stdout.log 2>&1 &
          echo $! > artifacts/v10/P09/runtime/health-clamd.pid
          python3 - <<'PY'
          import socket, time
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 3310), timeout=1) as sock:
                      sock.sendall(b'zVERSION\0')
                      data = sock.recv(4096)
                      if data:
                          open('artifacts/v10/P09/clamav/health-version.txt', 'wb').write(data.rstrip(b'\0') + b'\n')
                          print(data.rstrip(b'\0').decode('utf-8', 'replace'))
                          raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit('native clamd did not become ready')
          PY

      - name: Verify health and Installer code boundary
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          python3 -m py_compile scripts/p09/integration_env.py scripts/p09/integration_common.py scripts/p09/integration_health.py scripts/p09/clamd_fault_server.py
          find internal/files services/platformapi/cmd/server services/platformapi/cmd/filepreflight -type f -name '*.go' -print0 \
            | xargs -0 gofmt -d | tee /tmp/p09-health-gofmt.diff
          test ! -s /tmp/p09-health-gofmt.diff
          go test ./internal/files
          go vet ./internal/files ./services/platformapi/cmd/server ./services/platformapi/cmd/filepreflight
          php -l installer/src/Shell.php
          php -l installer/src/FilePreflight.php
          php -l installer/public/index.php

      - name: Apply P05 through P09 migrations
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          for migration in \
            migrations/000001_links_vertical_slice.sql \
            migrations/000002_custom_domains.sql \
            migrations/000003_analytics.sql \
            migrations/000004_qr.sql \
            migrations/000005_files.sql; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < "$migration"
          done

      - name: Build native platform and mandatory preflight
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/gojet-p09/platformapi ./services/platformapi/cmd/server
          go build -trimpath -o /tmp/gojet-p09/filepreflight ./services/platformapi/cmd/filepreflight
          file /tmp/gojet-p09/platformapi /tmp/gojet-p09/filepreflight
          sha256sum /tmp/gojet-p09/platformapi /tmp/gojet-p09/filepreflight > artifacts/v10/P09/runtime/health-native-binaries.sha256

      - name: Start native platform service with health authority
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gojet-p09/platformapi > artifacts/v10/P09/runtime/health-platformapi.log 2>&1 &
          echo $! > artifacts/v10/P09/runtime/health-platformapi.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/v10/P09/runtime/health-platformapi.log || true
          exit 1

      - name: Run P09-T019 and P09-T020
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          for case_id in P09-T019 P09-T020; do
            GITHUB_SHA="$exact_head" python3 scripts/p09/integration_health.py --case "$case_id"
          done

      - name: Verify exact-head health evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          EXACT_HEAD="$exact_head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/v10/P09/results')
          errors = []
          for case_id in ('P09-T019', 'P09-T020'):
              path = root / f'{case_id}.json'
              if not path.is_file():
                  errors.append(f'missing {path}')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('implementation_commit') != os.environ['EXACT_HEAD']:
                  errors.append(f'{case_id} exact-head mismatch')
              if data.get('status') != 'PASS' or data.get('errors') != []:
                  errors.append(f'{case_id} not PASS: {data.get("errors")}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'P09-T019..T020 exact-head evidence PASS on {os.environ["EXACT_HEAD"]}')
          PY

      - name: Capture health status evidence
        if: always()
        shell: bash
        run: |
          set +e
          curl -sS \
            -H 'X-GoJet-Test-Actor: p09-evidence' \
            -H 'X-GoJet-Test-Admin-Role: admin' \
            http://127.0.0.1:18081/api/admin/platform/storage \
            > artifacts/v10/P09/runtime/admin-storage-health.json 2> artifacts/v10/P09/runtime/admin-storage-health.err
          cp /tmp/gojet-p09/clamd-health.log artifacts/v10/P09/clamav/health-clamd.log 2>/dev/null || true
          true

      - name: Stop native health services
        if: always()
        shell: bash
        run: |
          set +e
          kill "$(cat artifacts/v10/P09/runtime/health-platformapi.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat artifacts/v10/P09/runtime/health-clamd.pid 2>/dev/null)" 2>/dev/null || true
          true

      - name: Upload P09 health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p09-health-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v10/P09/results/P09-T019.json
            artifacts/v10/P09/results/P09-T020.json
            artifacts/v10/P09/clamav/health-version.txt
            artifacts/v10/P09/clamav/health-clamd.log
            artifacts/v10/P09/clamav/health-clamd-stdout.log
            artifacts/v10/P09/clamav/health-freshclam.log
            artifacts/v10/P09/runtime/health-native-binaries.sha256
            artifacts/v10/P09/runtime/health-platformapi.log
            artifacts/v10/P09/runtime/admin-storage-health.json
            artifacts/v10/P09/runtime/admin-storage-health.err
          if-no-files-found: warn
          retention-days: 30
