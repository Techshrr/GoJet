name: P10 Evidence Coherence

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/text/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
      - 'scripts/p10/**'
      - 'artifacts/v10/P10/**'
      - '.github/workflows/p10-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p10-evidence-coherence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    name: P10 exact-head evidence coherence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify P10 coherence validator
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p10/validate.py scripts/p10/validate_coherence.py scripts/p10/validate_contract.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Wait for exact-head P10 evidence producers and bind artifacts
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P10
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          required={
            'P10 Text Contract': lambda sha: f'p10-text-contract-{sha}',
            'P10 Real Text Integration': lambda sha: f'gojet-v10-p10-integration-{sha}',
            'P10 Workspace Text Browser': lambda sha: f'gojet-v10-p10-browser-{sha}',
          }
          sha=os.environ['EXACT_HEAD']; repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; path=Path('artifacts/v10/P10/evidence-producer-manifest.json')
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          deadline=time.time()+35*60
          while time.time()<deadline:
            query=urllib.parse.urlencode({'head_sha':sha,'event':'pull_request','per_page':100})
            runs=get(f'https://api.github.com/repos/{repo}/actions/runs?{query}')['workflow_runs']
            latest={}
            for run in runs:
              name=run.get('name')
              if name in required and (name not in latest or int(run.get('id',0))>int(latest[name].get('id',0))): latest[name]=run
            missing=[name for name in required if name not in latest]
            pending=[name for name in required if name in latest and latest[name].get('status')!='completed']
            failed=[name for name in required if name in latest and latest[name].get('status')=='completed' and latest[name].get('conclusion')!='success']
            entries={}
            if not missing and not pending and not failed:
              for name,run in latest.items():
                artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
                expected=required[name](sha)
                matches=[item for item in artifacts if item.get('name')==expected and not item.get('expired')]
                if len(matches)!=1: failed.append(f'{name}:artifact:{expected}'); continue
                item=matches[0]
                entries[name]={'run_id':int(run['id']),'run_number':int(run.get('run_number',0)),'head_sha':run.get('head_sha'),'status':run.get('status'),'conclusion':run.get('conclusion'),'html_url':run.get('html_url'),'artifact':{'id':int(item['id']),'name':item['name'],'digest':item.get('digest'),'size_in_bytes':int(item.get('size_in_bytes',0))}}
            manifest={'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),'implementation_commit':sha,'required_workflows':entries,'missing':missing,'pending':pending,'failed':failed}
            path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            if failed: raise SystemExit('required P10 producer/artifact failed: '+', '.join(failed))
            if not missing and not pending and len(entries)==len(required): print(f'P10 producers/artifacts green for {sha}'); break
            print(f'Waiting P10 producers missing={missing} pending={pending}'); time.sleep(10)
          else: raise SystemExit(f'timed out waiting for P10 producers on {sha}')
          PY

      - name: Download exact-head P10 evidence artifacts
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          read_run() { python3 - "$1" <<'PY'
          import json,sys
          data=json.load(open('artifacts/v10/P10/evidence-producer-manifest.json',encoding='utf-8'))
          print(data['required_workflows'][sys.argv[1]]['run_id'])
          PY
          }
          contract_run="$(read_run 'P10 Text Contract')"
          integration_run="$(read_run 'P10 Real Text Integration')"
          browser_run="$(read_run 'P10 Workspace Text Browser')"
          rm -rf /tmp/p10-contract /tmp/p10-integration /tmp/p10-browser
          mkdir -p /tmp/p10-contract /tmp/p10-integration /tmp/p10-browser artifacts/v10/P10/contract artifacts/v10/P10/api artifacts/v10/P10/headers artifacts/v10/P10/browser artifacts/v10/P10/captures artifacts/v10/P10/results
          gh run download "$contract_run" --repo "$REPOSITORY" --name "p10-text-contract-$EXACT_HEAD" --dir /tmp/p10-contract
          gh run download "$integration_run" --repo "$REPOSITORY" --name "gojet-v10-p10-integration-$EXACT_HEAD" --dir /tmp/p10-integration
          gh run download "$browser_run" --repo "$REPOSITORY" --name "gojet-v10-p10-browser-$EXACT_HEAD" --dir /tmp/p10-browser
          for name in contract.json implementation_commit.txt base_integration_commit.txt case_range.txt capabilities.txt api-authority.txt ugc-seo-boundary.txt; do
            source="$(find /tmp/p10-contract -type f -name "$name" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P10/contract/$name"
          done
          test "$(cat artifacts/v10/P10/contract/implementation_commit.txt)" = "$EXACT_HEAD"
          for number in 001 002 003 004 005 012 015; do source="$(find /tmp/p10-integration -type f -name "P10-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P10/api/P10-T${number}.json"; done
          for number in 006 007 008 009 010 011 013 014; do source="$(find /tmp/p10-integration -type f -name "P10-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P10/headers/P10-T${number}.json"; done
          for number in 016 017 018; do source="$(find /tmp/p10-browser -type f -name "P10-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P10/browser/P10-T${number}.json"; done
          find /tmp/p10-browser -type f -name 'P10-T018-*.png' -print -exec cp '{}' artifacts/v10/P10/captures/ ';'
          test "$(find artifacts/v10/P10/api -maxdepth 1 -type f -name 'P10-T*.json' | wc -l)" -eq 7
          test "$(find artifacts/v10/P10/headers -maxdepth 1 -type f -name 'P10-T*.json' | wc -l)" -eq 8
          test "$(find artifacts/v10/P10/browser -maxdepth 1 -type f -name 'P10-T*.json' | wc -l)" -eq 3
          test "$(find artifacts/v10/P10/captures -maxdepth 1 -type f -name 'P10-T018-*.png' | wc -l)" -ge 11

      - name: Run P10-T019 exact-head evidence coherence
        run: |
          set -euo pipefail
          python3 scripts/p10/validate.py --case P10-T019
          python3 - <<'PY'
          import json,subprocess
          data=json.load(open('artifacts/v10/P10/results/P10-T019.json',encoding='utf-8'))
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert data['status']=='PASS' and data['errors']==[],data
          assert data['implementation_commit']==head,data
          obs=data['observations']; assert obs['input_evidence_count']==18 and obs['same_exact_head'] is True and obs['capture_count']>=11,obs
          assert set(obs['producer_run_ids'])=={'P10 Text Contract','P10 Real Text Integration','P10 Workspace Text Browser'},obs
          for value in obs['producer_artifacts'].values(): assert value['id']>0 and value['digest'].startswith('sha256:'),value
          print(f'P10-T019 exact-head coherence PASS on {head}')
          PY

      - name: Upload P10 coherence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p10-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P10/evidence-producer-manifest.json
            artifacts/v10/P10/evidence-index.json
            artifacts/v10/P10/contract/
            artifacts/v10/P10/api/P10-T*.json
            artifacts/v10/P10/headers/P10-T*.json
            artifacts/v10/P10/browser/P10-T*.json
            artifacts/v10/P10/captures/
            artifacts/v10/P10/results/P10-T019.json
            artifacts/v10/P10/test-plan.json
            artifacts/v10/P10/review.md
