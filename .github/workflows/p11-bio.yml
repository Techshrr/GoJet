name: P11 Bio Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/v10/P11/**'
      - 'scripts/p11/**'
      - '.github/workflows/p11-*.yml'
      - 'internal/bio/**'
      - 'internal/links/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p11-bio-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: P11 contract freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile P11 contract validator
        run: python3 -m py_compile scripts/p11/validate_contract.py

      - name: Validate frozen P11 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p11/validate_contract.py | tee /tmp/p11-contract.json

      - name: Preserve current native compile and unit boundary
        run: go test ./...

      - name: Record exact-head contract evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p11-contract-evidence
          cp /tmp/p11-contract.json /tmp/p11-contract-evidence/contract.json 2>/dev/null || true
          git rev-parse HEAD > /tmp/p11-contract-evidence/implementation_commit.txt
          printf '%s\n' '4d2186da8b2958c7618a233f53908f2914c389a3' > /tmp/p11-contract-evidence/base_integration_commit.txt
          printf '%s\n' '7db4fca49ba3fd8e60600ecdf41847c7e2f94776' > /tmp/p11-contract-evidence/predecessor_signed_source.txt
          printf '%s\n' 'P11-T001..P11-T020' > /tmp/p11-contract-evidence/case_range.txt
          printf '%s\n' 'CAP-BIO P11 G3/G7; CAP-BIO-OPT-IN-INDEX DEFERRED' > /tmp/p11-contract-evidence/capabilities.txt
          printf '%s\n' 'Workspace exact HTTP family is P11 implementation authority; IA-exact public Bio dependency is GET /api/public/bio/{slug}.' > /tmp/p11-contract-evidence/api-authority.txt
          printf '%s\n' 'PUB-BIO /p/{slug}: noindex; sitemap=no; outbound rel=ugc nofollow; P16 and release-wide G7 remain later-owned.' > /tmp/p11-contract-evidence/ugc-seo-boundary.txt

      - name: Upload P11 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-bio-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/p11-contract-evidence
          if-no-files-found: error
          retention-days: 14
