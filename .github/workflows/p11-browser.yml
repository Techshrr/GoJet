name: P11 Workspace Bio Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/bio/**'
      - 'internal/links/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
      - 'scripts/p11/**'
      - 'artifacts/v10/P11/**'
      - '.github/workflows/p11-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p11-workspace-bio-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: P11 real Bio Workspace and public browser evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_ANALYTICS_ENABLED: '0'
      GOJET_QR_WORKSPACE_QUOTA: '200'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_BIO_ENABLED: '1'
      GOJET_BIO_WORKSPACE_QUOTA: '2'
      GOJET_PLATFORMAPI_PROXY: http://127.0.0.1:18081
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_REDIS_HOST: 127.0.0.1
      GOJET_TEST_REDIS_PORT: '6379'
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081
      GOJET_TEST_WORKSPACE_URL: http://127.0.0.1:4174
      GOJET_TEST_WORKSPACE_VIEWER_URL: http://127.0.0.1:4175
      GOJET_TEST_WORKSPACE_ID: ws-p11-browser
      GOJET_TEST_ACTOR_ID: p11-browser-owner

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"

      - name: Install browser and database clients
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || test -x /usr/bin/chromium
          mysql --version
          redis-cli --version

      - name: Verify exact browser dependency boundary
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P11/browser artifacts/v10/P11/captures artifacts/v10/P11/runtime
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          pnpm install --frozen-lockfile
          node --check scripts/p11/browser.mjs
          pnpm run typecheck:packages
          pnpm --filter @gojet/workspace typecheck
          go test ./internal/bio ./internal/links ./services/platformapi/cmd/server
          go vet ./internal/bio ./internal/links ./services/platformapi/cmd/server

      - name: Apply P05 through P11 migrations
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          for migration in \
            migrations/000001_links_vertical_slice.sql \
            migrations/000002_custom_domains.sql \
            migrations/000003_analytics.sql \
            migrations/000004_qr.sql \
            migrations/000005_files.sql \
            migrations/000006_text.sql \
            migrations/000007_bio.sql; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < "$migration"
          done

      - name: Build native platformapi and owner/viewer Workspace variants
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/gojet-p11-browser-platformapi ./services/platformapi/cmd/server
          sha256sum /tmp/gojet-p11-browser-platformapi > artifacts/v10/P11/runtime/browser-native-platformapi.sha256
          (
            export VITE_GOJET_TEST_AUTH_ENABLED=1
            export VITE_GOJET_TEST_WORKSPACE_ID="$GOJET_TEST_WORKSPACE_ID"
            export VITE_GOJET_TEST_ACTOR_ID="$GOJET_TEST_ACTOR_ID"
            export VITE_GOJET_TEST_WORKSPACE_ROLE=owner
            pnpm --filter @gojet/workspace exec vite build --outDir dist-owner
          )
          (
            export VITE_GOJET_TEST_AUTH_ENABLED=1
            export VITE_GOJET_TEST_WORKSPACE_ID="$GOJET_TEST_WORKSPACE_ID"
            export VITE_GOJET_TEST_ACTOR_ID=p11-browser-viewer
            export VITE_GOJET_TEST_WORKSPACE_ROLE=viewer
            pnpm --filter @gojet/workspace exec vite build --outDir dist-viewer
          )

      - name: Start native API and both real Workspace builds
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gojet-p11-browser-platformapi > artifacts/v10/P11/runtime/browser-platformapi.log 2>&1 &
          echo $! > artifacts/v10/P11/runtime/browser-platformapi.pid
          pnpm --filter @gojet/workspace exec vite preview --host 127.0.0.1 --port 4174 --outDir dist-owner > artifacts/v10/P11/runtime/browser-owner.log 2>&1 &
          echo $! > artifacts/v10/P11/runtime/browser-owner.pid
          pnpm --filter @gojet/workspace exec vite preview --host 127.0.0.1 --port 4175 --outDir dist-viewer > artifacts/v10/P11/runtime/browser-viewer.log 2>&1 &
          echo $! > artifacts/v10/P11/runtime/browser-viewer.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:4174/app/bio >/dev/null \
              && curl -fsS http://127.0.0.1:4175/app/bio >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/v10/P11/runtime/browser-platformapi.log || true
          cat artifacts/v10/P11/runtime/browser-owner.log || true
          cat artifacts/v10/P11/runtime/browser-viewer.log || true
          exit 1

      - name: Run P11-T016 through P11-T018
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          GITHUB_SHA="$exact_head" node scripts/p11/browser.mjs --case P11-T016
          GITHUB_SHA="$exact_head" node scripts/p11/browser.mjs --case P11-T017
          GITHUB_SHA="$exact_head" node scripts/p11/browser.mjs --case P11-T018

      - name: Verify exact-head browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          EXACT_HEAD="$exact_head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          head=os.environ['EXACT_HEAD']; root=Path('artifacts/v10/P11/browser'); errors=[]
          for number in range(16,19):
              cid=f'P11-T{number:03d}'; path=root/f'{cid}.json'
              if not path.is_file(): errors.append(f'missing {path}'); continue
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('implementation_commit') != head: errors.append(f'{cid} exact-head mismatch')
              if data.get('status') != 'PASS' or data.get('errors') != []: errors.append(f'{cid} not PASS: {data.get("errors")}')
          if errors: raise SystemExit('\n'.join(errors))
          print(f'P11-T016..T018 exact-head browser evidence PASS on {head}')
          PY
          test "$(find artifacts/v10/P11/captures -type f -name 'P11-T018-*.png' | wc -l)" -ge 11

      - name: Stop P11 browser services
        if: always()
        run: |
          set +e
          for file in artifacts/v10/P11/runtime/browser-owner.pid artifacts/v10/P11/runtime/browser-viewer.pid artifacts/v10/P11/runtime/browser-platformapi.pid; do
            kill "$(cat "$file" 2>/dev/null)" 2>/dev/null || true
          done
          true

      - name: Upload P11 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p11-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v10/P11/browser/P11-T016.json
            artifacts/v10/P11/browser/P11-T017.json
            artifacts/v10/P11/browser/P11-T018.json
            artifacts/v10/P11/captures/
            artifacts/v10/P11/runtime/
          if-no-files-found: warn
          retention-days: 30
