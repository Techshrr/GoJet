name: P11 Evidence Coherence

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/bio/**'
      - 'internal/links/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
      - 'scripts/p11/**'
      - 'artifacts/v10/P11/**'
      - '.github/workflows/p11-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p11-evidence-coherence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    name: P11 exact-head evidence coherence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify P11 coherence validator
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p11/validate.py scripts/p11/validate_coherence.py scripts/p11/validate_contract.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Wait for exact-head P11 evidence producers and bind artifacts
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P11
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          required={
            'P11 Bio Contract': lambda sha: f'p11-bio-contract-{sha}',
            'P11 Real Bio Integration': lambda sha: f'gojet-v10-p11-integration-{sha}',
            'P11 Workspace Bio Browser': lambda sha: f'gojet-v10-p11-browser-{sha}',
          }
          sha=os.environ['EXACT_HEAD']; repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; path=Path('artifacts/v10/P11/evidence-producer-manifest.json')
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          deadline=time.time()+35*60
          while time.time()<deadline:
            query=urllib.parse.urlencode({'head_sha':sha,'event':'pull_request','per_page':100})
            runs=get(f'https://api.github.com/repos/{repo}/actions/runs?{query}')['workflow_runs']
            latest={}
            for run in runs:
              name=run.get('name')
              if name in required and (name not in latest or int(run.get('id',0))>int(latest[name].get('id',0))): latest[name]=run
            missing=[name for name in required if name not in latest]
            pending=[name for name in required if name in latest and latest[name].get('status')!='completed']
            failed=[name for name in required if name in latest and latest[name].get('status')=='completed' and latest[name].get('conclusion')!='success']
            entries={}
            if not missing and not pending and not failed:
              for name,run in latest.items():
                artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
                expected=required[name](sha)
                matches=[item for item in artifacts if item.get('name')==expected and not item.get('expired')]
                if len(matches)!=1: failed.append(f'{name}:artifact:{expected}'); continue
                item=matches[0]
                entries[name]={'run_id':int(run['id']),'run_number':int(run.get('run_number',0)),'head_sha':run.get('head_sha'),'status':run.get('status'),'conclusion':run.get('conclusion'),'html_url':run.get('html_url'),'artifact':{'id':int(item['id']),'name':item['name'],'digest':item.get('digest'),'size_in_bytes':int(item.get('size_in_bytes',0))}}
            manifest={'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),'implementation_commit':sha,'required_workflows':entries,'missing':missing,'pending':pending,'failed':failed}
            path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            if failed: raise SystemExit('required P11 producer/artifact failed: '+', '.join(failed))
            if not missing and not pending and len(entries)==len(required): print(f'P11 producers/artifacts green for {sha}'); break
            print(f'Waiting P11 producers missing={missing} pending={pending}'); time.sleep(10)
          else: raise SystemExit(f'timed out waiting for P11 producers on {sha}')
          PY

      - name: Download exact-head P11 evidence artifacts
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          read_run() { python3 - "$1" <<'PY'
          import json,sys
          data=json.load(open('artifacts/v10/P11/evidence-producer-manifest.json',encoding='utf-8'))
          print(data['required_workflows'][sys.argv[1]]['run_id'])
          PY
          }
          contract_run="$(read_run 'P11 Bio Contract')"
          integration_run="$(read_run 'P11 Real Bio Integration')"
          browser_run="$(read_run 'P11 Workspace Bio Browser')"
          rm -rf /tmp/p11-contract /tmp/p11-integration /tmp/p11-browser
          mkdir -p /tmp/p11-contract /tmp/p11-integration /tmp/p11-browser \
            artifacts/v10/P11/contract artifacts/v10/P11/api artifacts/v10/P11/headers artifacts/v10/P11/sitemap \
            artifacts/v10/P11/browser artifacts/v10/P11/captures artifacts/v10/P11/runtime artifacts/v10/P11/results
          gh run download "$contract_run" --repo "$REPOSITORY" --name "p11-bio-contract-$EXACT_HEAD" --dir /tmp/p11-contract
          gh run download "$integration_run" --repo "$REPOSITORY" --name "gojet-v10-p11-integration-$EXACT_HEAD" --dir /tmp/p11-integration
          gh run download "$browser_run" --repo "$REPOSITORY" --name "gojet-v10-p11-browser-$EXACT_HEAD" --dir /tmp/p11-browser

          for name in contract.json implementation_commit.txt base_integration_commit.txt predecessor_signed_source.txt case_range.txt capabilities.txt api-authority.txt ugc-seo-boundary.txt; do
            source="$(find /tmp/p11-contract -type f -name "$name" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P11/contract/$name"
          done
          test "$(cat artifacts/v10/P11/contract/implementation_commit.txt)" = "$EXACT_HEAD"

          for number in 001 002 003 004 010 012; do source="$(find /tmp/p11-integration -type f -name "P11-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P11/api/P11-T${number}.json"; done
          for number in 005 006 007 008 009 011 013 015; do source="$(find /tmp/p11-integration -type f -name "P11-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P11/headers/P11-T${number}.json"; done
          source="$(find /tmp/p11-integration -type f -name 'P11-T014.json' -print -quit)"; test -n "$source"; cp "$source" artifacts/v10/P11/sitemap/P11-T014.json
          if [ -d /tmp/p11-integration/runtime ]; then cp -a /tmp/p11-integration/runtime/. artifacts/v10/P11/runtime/; fi
          for name in mysql-bio-pages.err mysql-bio-links.err mysql-bio-counters.err mysql-bio-audit.err redis-bio-risk-keys.err; do test -f "artifacts/v10/P11/runtime/$name"; test ! -s "artifacts/v10/P11/runtime/$name"; done

          for number in 016 017 018; do source="$(find /tmp/p11-browser -type f -name "P11-T${number}.json" -print -quit)"; test -n "$source"; cp "$source" "artifacts/v10/P11/browser/P11-T${number}.json"; done
          find /tmp/p11-browser -type f -name 'P11-T018-*.png' -print -exec cp '{}' artifacts/v10/P11/captures/ ';'
          if [ -d /tmp/p11-browser/runtime ]; then cp -a /tmp/p11-browser/runtime/. artifacts/v10/P11/runtime/; fi

          test "$(find artifacts/v10/P11/api -maxdepth 1 -type f -name 'P11-T*.json' | wc -l)" -eq 6
          test "$(find artifacts/v10/P11/headers -maxdepth 1 -type f -name 'P11-T*.json' | wc -l)" -eq 8
          test "$(find artifacts/v10/P11/sitemap -maxdepth 1 -type f -name 'P11-T*.json' | wc -l)" -eq 1
          test "$(find artifacts/v10/P11/browser -maxdepth 1 -type f -name 'P11-T*.json' | wc -l)" -eq 3
          test "$(find artifacts/v10/P11/captures -maxdepth 1 -type f -name 'P11-T018-*.png' | wc -l)" -ge 11

      - name: Run P11-T019 exact-head evidence coherence
        run: |
          set -euo pipefail
          python3 scripts/p11/validate.py --case P11-T019
          python3 - <<'PY'
          import json,subprocess
          data=json.load(open('artifacts/v10/P11/results/P11-T019.json',encoding='utf-8'))
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert data['status']=='PASS' and data['errors']==[],data
          assert data['implementation_commit']==head,data
          obs=data['observations']
          assert obs['input_evidence_count']==18 and obs['same_exact_head'] is True and obs['capture_count']>=11,obs
          assert obs['runtime_error_files_clean'] is True and obs['sitemap_diff_inspectable'] is True,obs
          assert set(obs['producer_run_ids'])=={'P11 Bio Contract','P11 Real Bio Integration','P11 Workspace Bio Browser'},obs
          for value in obs['producer_artifacts'].values(): assert value['id']>0 and value['digest'].startswith('sha256:'),value
          print(f'P11-T019 exact-head coherence PASS on {head}')
          PY

      - name: Upload P11 coherence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p11-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P11/evidence-producer-manifest.json
            artifacts/v10/P11/evidence-index.json
            artifacts/v10/P11/contract/
            artifacts/v10/P11/api/P11-T*.json
            artifacts/v10/P11/headers/P11-T*.json
            artifacts/v10/P11/sitemap/P11-T*.json
            artifacts/v10/P11/browser/P11-T*.json
            artifacts/v10/P11/captures/
            artifacts/v10/P11/runtime/
            artifacts/v10/P11/results/P11-T019.json
            artifacts/v10/P11/test-plan.json
            artifacts/v10/P11/review.md
