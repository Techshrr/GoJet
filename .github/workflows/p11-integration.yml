name: P11 Real Bio Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/bio/**'
      - 'internal/links/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'scripts/p11/**'
      - 'artifacts/v10/P11/**'
      - '.github/workflows/p11-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p11-real-bio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-integration:
    name: P11 real MySQL Redis Bio API public and SEO tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_TEST_AUTH_ENABLED: '1'
      GOJET_ANALYTICS_ENABLED: '0'
      GOJET_QR_WORKSPACE_QUOTA: '200'
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_BIO_ENABLED: '1'
      GOJET_BIO_WORKSPACE_QUOTA: '3'
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_REDIS_HOST: 127.0.0.1
      GOJET_TEST_REDIS_PORT: '6379'
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18081

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install MySQL and Redis clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools
          mysql --version
          redis-cli --version

      - name: Verify P11 drivers and native packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P11/api artifacts/v10/P11/headers artifacts/v10/P11/sitemap artifacts/v10/P11/runtime
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          python3 -m py_compile scripts/p11/integration_common.py scripts/p11/integration.py scripts/p11/seo.py scripts/p11/validate_contract.py
          find internal/bio services/platformapi/cmd/server -type f -name '*.go' -print0 | xargs -0 gofmt -d | tee /tmp/p11-gofmt.diff
          test ! -s /tmp/p11-gofmt.diff
          go test ./internal/bio ./internal/links ./services/platformapi/cmd/server
          go vet ./internal/bio ./internal/links ./services/platformapi/cmd/server

      - name: Apply P05 through P11 migrations
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          for migration in \
            migrations/000001_links_vertical_slice.sql \
            migrations/000002_custom_domains.sql \
            migrations/000003_analytics.sql \
            migrations/000004_qr.sql \
            migrations/000005_files.sql \
            migrations/000006_text.sql \
            migrations/000007_bio.sql; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test < "$migration"
          done
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SHOW TABLES LIKE 'bio%'" | sort | tee artifacts/v10/P11/runtime/mysql-bio-tables.txt

      - name: Build and start native platformapi
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/gojet-p11-platformapi ./services/platformapi/cmd/server
          sha256sum /tmp/gojet-p11-platformapi > artifacts/v10/P11/runtime/native-platformapi.sha256
          /tmp/gojet-p11-platformapi > artifacts/v10/P11/runtime/platformapi.log 2>&1 &
          echo $! > artifacts/v10/P11/runtime/platformapi.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/v10/P11/runtime/platformapi.log || true
          exit 1

      - name: Run P11-T001 through P11-T015
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          for number in $(seq -w 1 12); do
            GITHUB_SHA="$exact_head" python3 scripts/p11/integration.py --case "P11-T0${number}"
          done
          GITHUB_SHA="$exact_head" python3 scripts/p11/seo.py --case P11-T013
          GITHUB_SHA="$exact_head" python3 scripts/p11/seo.py --case P11-T014
          GITHUB_SHA="$exact_head" python3 scripts/p11/seo.py --case P11-T015

      - name: Verify exact-head P11-T001 through P11-T015 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          EXACT_HEAD="$exact_head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          head = os.environ['EXACT_HEAD']
          root = Path('artifacts/v10/P11')
          api = {1,2,3,4,10,12}
          sitemap = {14}
          errors = []
          for number in range(1, 16):
              cid = f'P11-T{number:03d}'
              directory = 'api' if number in api else ('sitemap' if number in sitemap else 'headers')
              path = root / directory / f'{cid}.json'
              if not path.is_file():
                  errors.append(f'missing {path}')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('implementation_commit') != head: errors.append(f'{cid} implementation_commit mismatch')
              if data.get('status') != 'PASS': errors.append(f"{cid} status={data.get('status')}")
              if data.get('errors') != []: errors.append(f"{cid} errors={data.get('errors')}")
          if errors: raise SystemExit('\n'.join(errors))
          print(f'P11-T001..T015 exact-head evidence PASS on {head}')
          PY

      - name: Capture P11 runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/v10/P11/runtime
          export MYSQL_PWD=root
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SELECT id,workspace_id,slug,title,status,version,published_at,created_by,created_at,updated_at,deleted_at FROM bio_pages ORDER BY id" > artifacts/v10/P11/runtime/mysql-bio-pages.tsv 2> artifacts/v10/P11/runtime/mysql-bio-pages.err
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SELECT id,bio_page_id,position,label,destination_url,destination_fingerprint,risk_status,risk_checked_at FROM bio_links ORDER BY bio_page_id,position" > artifacts/v10/P11/runtime/mysql-bio-links.tsv 2> artifacts/v10/P11/runtime/mysql-bio-links.err
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SELECT workspace_id,active_count,updated_at FROM bio_workspace_counters ORDER BY workspace_id" > artifacts/v10/P11/runtime/mysql-bio-counters.tsv 2> artifacts/v10/P11/runtime/mysql-bio-counters.err
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B gojet_test -e "SELECT id,workspace_id,bio_page_id,actor_id,action,request_correlation_id,result,created_at FROM bio_audit_events ORDER BY id" > artifacts/v10/P11/runtime/mysql-bio-audit.tsv 2> artifacts/v10/P11/runtime/mysql-bio-audit.err
          redis-cli -h 127.0.0.1 -p 6379 --scan --pattern 'risk:bio-child:*' | sort > artifacts/v10/P11/runtime/redis-bio-risk-keys.txt 2> artifacts/v10/P11/runtime/redis-bio-risk-keys.err
          true

      - name: Stop native P11 service
        if: always()
        shell: bash
        run: |
          set +e
          kill "$(cat artifacts/v10/P11/runtime/platformapi.pid 2>/dev/null)" 2>/dev/null || true
          true

      - name: Upload P11 real integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p11-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v10/P11/api/P11-T001.json
            artifacts/v10/P11/api/P11-T002.json
            artifacts/v10/P11/api/P11-T003.json
            artifacts/v10/P11/api/P11-T004.json
            artifacts/v10/P11/headers/P11-T005.json
            artifacts/v10/P11/headers/P11-T006.json
            artifacts/v10/P11/headers/P11-T007.json
            artifacts/v10/P11/headers/P11-T008.json
            artifacts/v10/P11/headers/P11-T009.json
            artifacts/v10/P11/api/P11-T010.json
            artifacts/v10/P11/headers/P11-T011.json
            artifacts/v10/P11/api/P11-T012.json
            artifacts/v10/P11/headers/P11-T013.json
            artifacts/v10/P11/sitemap/P11-T014.json
            artifacts/v10/P11/headers/P11-T015.json
            artifacts/v10/P11/runtime/
          if-no-files-found: warn
          retention-days: 30
