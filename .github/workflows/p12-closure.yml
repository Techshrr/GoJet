name: P12 Closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/links/**'
      - 'internal/analytics/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
      - 'scripts/p12/**'
      - 'artifacts/v10/P12/**'
      - '.github/workflows/p05-*.yml'
      - '.github/workflows/p06-*.yml'
      - '.github/workflows/p07-*.yml'
      - '.github/workflows/p08-*.yml'
      - '.github/workflows/p09-*.yml'
      - '.github/workflows/p10-*.yml'
      - '.github/workflows/p11-*.yml'
      - '.github/workflows/p12-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: p12-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: P12 exact-head signed closure
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify P12 closure validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p12/validate.py scripts/p12/validate_coherence.py scripts/p12/validate_closure.py scripts/p12/validate_contract.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Wait for or dispatch exact-head affected P00-P12 matrix
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P12
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          required = {
              'P00 Bootstrap and G0 Traceability': 'p00-bootstrap.yml',
              'P01 Engineering Foundation': 'p01-engineering.yml',
              'P02 Brand Foundation': 'p02-brand-foundation.yml',
              'P03 Design System': 'p03-design-system.yml',
              'P04 Product Shells': 'p04-product-shells.yml',
              'P05 Links Domain Contract': 'p05-links-domain-contract.yml',
              'P05 Real Integration': 'p05-integration.yml',
              'P05 Workspace Browser': 'p05-browser.yml',
              'P06 Custom Domains': 'p06-custom-domains.yml',
              'P06 Real Integration': 'p06-integration.yml',
              'P06 Workspace Domains Browser': 'p06-browser.yml',
              'P07 Analytics Contract': 'p07-analytics.yml',
              'P07 Real Integration': 'p07-integration.yml',
              'P07 Workspace Analytics Browser': 'p07-browser.yml',
              'P08 QR Contract': 'p08-qr.yml',
              'P08 Real QR Integration': 'p08-integration.yml',
              'P08 Workspace QR Browser': 'p08-browser.yml',
              'P08 Evidence Coherence': 'p08-evidence.yml',
              'P09 Files Contract': 'p09-files.yml',
              'P09 Real Files and ClamAV Integration': 'p09-integration.yml',
              'P09 Files Health and Installer Preflight': 'p09-health.yml',
              'P09 Workspace Files Browser': 'p09-browser.yml',
              'P09 Evidence Coherence': 'p09-evidence.yml',
              'P10 Text Contract': 'p10-text.yml',
              'P10 Real Text Integration': 'p10-integration.yml',
              'P10 Workspace Text Browser': 'p10-browser.yml',
              'P10 Evidence Coherence': 'p10-evidence.yml',
              'P11 Bio Contract': 'p11-bio.yml',
              'P11 Real Bio Integration': 'p11-integration.yml',
              'P11 Workspace Bio Browser': 'p11-browser.yml',
              'P11 Evidence Coherence': 'p11-evidence.yml',
              'P12 Workspace Organization Contract': 'p12-workspace-organization.yml',
              'P12 Real Workspace Organization Integration': 'p12-integration.yml',
              'P12 Workspace Organization Browser': 'p12-browser.yml',
              'P12 Evidence Coherence': 'p12-evidence.yml',
          }
          p12_names = {
              'P12 Workspace Organization Contract',
              'P12 Real Workspace Organization Integration',
              'P12 Workspace Organization Browser',
              'P12 Evidence Coherence',
          }
          excluded = {
              'P05 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P06 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P07 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P08 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P09 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P10 Closure': 'revision-specific predecessor closure is inherited through P11 signed authority and is not reinterpreted on a P12 HEAD',
              'P11 Closure': 'revision-specific P11 signed authority is inherited from source b59dfbe794f7d2f7bf63fdc79116217c5d893e87 and artifact 9495896748; do not rerun/reinterpret P11 Closure on a P12 HEAD',
          }
          sha = os.environ['EXACT_HEAD']
          head_ref = os.environ['HEAD_REF']
          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          manifest_path = Path('artifacts/v10/P12/regression-manifest.json')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request_json(url, *, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          def fetch_runs():
              query = urllib.parse.urlencode({'head_sha': sha, 'per_page': 100})
              return request_json(f'https://api.github.com/repos/{repo}/actions/runs?{query}')['workflow_runs']

          def dispatch(workflow_file):
              encoded = urllib.parse.quote(workflow_file, safe='')
              request_json(
                  f'https://api.github.com/repos/{repo}/actions/workflows/{encoded}/dispatches',
                  method='POST',
                  body={'ref': head_ref},
              )

          dispatched = set()
          deadline = time.time() + 55 * 60
          while time.time() < deadline:
              runs = fetch_runs()
              latest = {}
              for run in runs:
                  name = run.get('name')
                  if name not in required:
                      continue
                  previous = latest.get(name)
                  if previous is None or int(run.get('id', 0)) > int(previous.get('id', 0)):
                      latest[name] = run

              missing = [name for name in required if name not in latest]
              pending = [name for name in required if name in latest and latest[name].get('status') != 'completed']
              failed = [name for name in required if name in latest and latest[name].get('status') == 'completed' and latest[name].get('conclusion') != 'success']

              manifest = {
                  'generated_at': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
                  'implementation_commit': sha,
                  'required_workflows': {
                      name: {
                          'run_id': int(latest[name]['id']),
                          'run_number': int(latest[name].get('run_number', 0)),
                          'head_sha': latest[name].get('head_sha'),
                          'event': latest[name].get('event'),
                          'status': latest[name].get('status'),
                          'conclusion': latest[name].get('conclusion'),
                          'html_url': latest[name].get('html_url'),
                      }
                      for name in required if name in latest
                  },
                  'excluded_revision_specific_workflows': excluded,
                  'dispatched_workflows': sorted(dispatched),
                  'missing': missing,
                  'pending': pending,
                  'failed': failed,
              }
              manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

              if failed:
                  raise SystemExit('required exact-head workflows failed: ' + ', '.join(failed))
              if not missing and not pending:
                  print(f'P00-P12 affected exact-head matrix is green for {sha}')
                  break

              for name in missing:
                  if name in p12_names or name in dispatched:
                      continue
                  print(f'Dispatching missing exact-head workflow {name} via {required[name]} at {head_ref}')
                  try:
                      dispatch(required[name])
                  except Exception as exc:
                      raise SystemExit(f'failed to dispatch {name}: {exc}') from exc
                  dispatched.add(name)

              print(f'Waiting exact-head matrix: missing={missing} pending={pending}')
              time.sleep(10)
          else:
              raise SystemExit(f'timed out waiting for P00-P12 affected workflows on {sha}')
          PY

      - name: Download exact-head P12 coherence evidence
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          evidence_run="$(python3 - <<'PY'
          import json
          data=json.load(open('artifacts/v10/P12/regression-manifest.json', encoding='utf-8'))
          print(data['required_workflows']['P12 Evidence Coherence']['run_id'])
          PY
          )"
          rm -rf /tmp/p12-evidence
          mkdir -p /tmp/p12-evidence
          gh run download "$evidence_run" --repo "$REPOSITORY" --name "gojet-v10-p12-evidence-$EXACT_HEAD" --dir /tmp/p12-evidence
          cp -a /tmp/p12-evidence/. artifacts/v10/P12/
          test -f artifacts/v10/P12/results/P12-T024.json
          test -f artifacts/v10/P12/evidence-index.json
          test "$(find artifacts/v10/P12/api artifacts/v10/P12/rbac artifacts/v10/P12/audit artifacts/v10/P12/security artifacts/v10/P12/browser artifacts/v10/P12/results -type f -name 'P12-T*.json' | wc -l)" -eq 24

      - name: Bind inherited authoritative P11 signed closure
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          P11_SOURCE='b59dfbe794f7d2f7bf63fdc79116217c5d893e87'
          P11_RUN='32649713397'
          P11_ARTIFACT='9495896748'
          P11_DIGEST='sha256:fe0edc8308cb4520929590efb261b87052423805ef02099066e818ff4cc5ae4f'
          rm -rf /tmp/p11-authority artifacts/v10/P12/inherited
          mkdir -p /tmp/p11-authority artifacts/v10/P12/inherited/P11

          REPOSITORY="$REPOSITORY" P11_SOURCE="$P11_SOURCE" P11_RUN="$P11_RUN" P11_ARTIFACT="$P11_ARTIFACT" P11_DIGEST="$P11_DIGEST" python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo=os.environ['REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          def get(path):
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run=get(f"actions/runs/{os.environ['P11_RUN']}")
          artifact=get(f"actions/artifacts/{os.environ['P11_ARTIFACT']}")
          source=os.environ['P11_SOURCE']
          expected_digest=os.environ['P11_DIGEST']
          assert run['head_sha'] == source, run
          assert run['status'] == 'completed' and run['conclusion'] == 'success', run
          assert int(artifact['id']) == int(os.environ['P11_ARTIFACT']), artifact
          assert artifact['digest'] == expected_digest, artifact
          assert artifact['expired'] is False, artifact
          assert int(artifact['workflow_run']['id']) == int(os.environ['P11_RUN']), artifact
          assert artifact['workflow_run']['head_sha'] == source, artifact
          data={
              'source_commit': source,
              'closure_run_id': int(os.environ['P11_RUN']),
              'workflow_status': run['status'],
              'workflow_conclusion': run['conclusion'],
              'workflow_head_sha': run['head_sha'],
              'artifact_id': int(os.environ['P11_ARTIFACT']),
              'artifact_name': artifact['name'],
              'artifact_digest': artifact['digest'],
              'artifact_expired': artifact['expired'],
              'archive_sha256': None,
          }
          Path('artifacts/v10/P12/inherited/p11-authority.json').write_text(json.dumps(data, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY

          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$REPOSITORY/actions/artifacts/$P11_ARTIFACT/zip" > /tmp/p11-authority.zip
          archive_sha="$(sha256sum /tmp/p11-authority.zip | awk '{print $1}')"
          test "sha256:$archive_sha" = "$P11_DIGEST"
          unzip -q /tmp/p11-authority.zip -d /tmp/p11-authority
          cp -a /tmp/p11-authority/. artifacts/v10/P12/inherited/P11/
          ARCHIVE_SHA="$archive_sha" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path=Path('artifacts/v10/P12/inherited/p11-authority.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['archive_sha256']=os.environ['ARCHIVE_SHA']
          path.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          test -f artifacts/v10/P12/inherited/P11/closure.json
          test -f artifacts/v10/P12/inherited/P11/results/P11-T020.json
          test -f artifacts/v10/P12/inherited/P11/review.md

      - name: Run P12-T025 exact-head closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p12/validate.py --case P12-T025 --closure
          python3 - <<'PY'
          import json
          import subprocess
          result=json.load(open('artifacts/v10/P12/results/P12-T025.json', encoding='utf-8'))
          closure=json.load(open('artifacts/v10/P12/closure.json', encoding='utf-8'))
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert result['implementation_commit'] == head, result
          assert result['status'] == 'PASS' and result['errors'] == [], result
          assert result['details']['input_evidence_count'] == 24, result['details']
          assert result['details']['regression_workflow_count'] == 35, result['details']
          inherited=result['details']['inherited_p11_signed_closure']
          assert inherited['source_commit'] == 'b59dfbe794f7d2f7bf63fdc79116217c5d893e87', inherited
          assert inherited['phase'] == 'signed' and inherited['merge_authoritative'] is True, inherited
          assert inherited['defects'] == {'p0':0,'p1':0,'decision_required':0}, inherited
          assert closure['implementation_commit'] == head and closure['status'] == 'PASS', closure
          if closure['phase'] == 'pre-sign':
              assert closure['merge_authoritative'] is False, closure
              assert closure['defects'] == {'p0': None, 'p1': None, 'decision_required': None}, closure['defects']
              print(f'P12-T025 pre-sign closure PASS on {head}; merge-authoritative=false')
          elif closure['phase'] == 'signed':
              assert closure['merge_authoritative'] is True, closure
              assert closure['defects'] == {'p0': 0, 'p1': 0, 'decision_required': 0}, closure['defects']
              print(f'P12-T025 signed closure PASS on {head}; merge-authoritative=true')
          else:
              raise AssertionError(closure)
          PY

      - name: Upload P12 closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p12-closure-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P12/regression-manifest.json
            artifacts/v10/P12/evidence-producer-manifest.json
            artifacts/v10/P12/evidence-index.json
            artifacts/v10/P12/closure-evidence-index.json
            artifacts/v10/P12/closure.json
            artifacts/v10/P12/contract/
            artifacts/v10/P12/api/
            artifacts/v10/P12/rbac/
            artifacts/v10/P12/audit/
            artifacts/v10/P12/security/
            artifacts/v10/P12/browser/
            artifacts/v10/P12/captures/
            artifacts/v10/P12/runtime/
            artifacts/v10/P12/results/P12-T*.json
            artifacts/v10/P12/inherited/
            artifacts/v10/P12/test-plan.json
            artifacts/v10/P12/review.md
