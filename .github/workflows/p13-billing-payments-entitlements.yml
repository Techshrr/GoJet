name: P13 Billing Payments Entitlements Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/v10/P13/**'
      - 'scripts/p13/**'
      - '.github/workflows/p13-*.yml'
      - 'internal/billing/**'
      - 'internal/domains/**'
      - 'internal/workspace/**'
      - 'migrations/**'
      - 'services/platformapi/**'
      - 'frontend/apps/workspace/**'
      - 'frontend/apps/admin/**'
      - 'frontend/apps/site/**'
      - 'frontend/packages/api-client/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/tokens/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p13-billing-payments-entitlements-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: P13 contract freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile P13 contract validator
        run: python3 -m py_compile scripts/p13/validate_contract.py

      - name: Validate frozen P13 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p13/validate_contract.py | tee /tmp/p13-contract.json

      - name: Preserve current native compile and unit boundary
        run: go test ./...

      - name: Record exact-head contract evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13-contract-evidence
          cp /tmp/p13-contract.json /tmp/p13-contract-evidence/contract.json 2>/dev/null || true
          git rev-parse HEAD > /tmp/p13-contract-evidence/implementation_commit.txt
          printf '%s\n' '7f39da389052b08f145e69dac2a715b9d303294d' > /tmp/p13-contract-evidence/base_integration_commit.txt
          printf '%s\n' '9d49d5ebf0e697ae9cd6537c432c27a15edc60bd' > /tmp/p13-contract-evidence/predecessor_signed_source.txt
          printf '%s\n' 'P13-T001..P13-T027' > /tmp/p13-contract-evidence/case_range.txt
          printf '%s\n' 'CAP-BILLING; CAP-PAYMENTS; CAP-PAYMENT-CALLBACKS; CAP-DOMAIN-ENTITLEMENT' > /tmp/p13-contract-evidence/capabilities.txt
          printf '%s\n' 'IA-exact: /app/billing, /pricing, /admin/commerce/plans, /admin/commerce/payments[{paymentId}], /admin/commerce/fx; only GET /api/public/plans is IA-exact API.' > /tmp/p13-contract-evidence/route-authority.txt
          printf '%s\n' 'Providers: alipay, wechat, epay, paypal, stripe, crypto; authenticated callback is P13 payment authority, never generic APP-WEBHOOKS.' > /tmp/p13-contract-evidence/provider-authority.txt
          printf '%s\n' 'features JSON is non-authoritative; durable server resolver governs grants; P06 domain safety remains conjunctive and inherited.' > /tmp/p13-contract-evidence/entitlement-authority.txt

      - name: Upload P13 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-billing-payments-entitlements-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/p13-contract-evidence
          if-no-files-found: error
          retention-days: 14
