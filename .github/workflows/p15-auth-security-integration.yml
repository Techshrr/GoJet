name: P15 Authentication Security Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'internal/auth/security_http.go'
      - 'internal/auth/security_redis.go'
      - 'internal/auth/turnstile.go'
      - 'internal/auth/store.go'
      - 'internal/support/turnstile.go'
      - 'internal/support/turnstile_deterministic.go'
      - 'scripts/p15/integration.py'
      - 'scripts/p15/case_config_core.py'
      - 'scripts/p15/case_config_security.py'
      - 'scripts/p15/t008_runner/**'
      - 'scripts/p15/t009_runner/**'
      - 'scripts/p15/t010_runner/**'
      - 'scripts/p15/t011_runner/**'
      - 'scripts/p15/t012_runner/**'
      - 'migrations/**'
      - 'artifacts/v10/P15/test-plan.json'
      - '.github/workflows/p15-auth-security-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-auth-security-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  t008-t012:
    name: P15-T008/T012 server-side auth security evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true&charset=utf8mb4
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_AUTH_CSRF_KEY_HEX: 102132435465768798a9babbdcddfe0f00112233445566778899aabbccddeeff

    steps:
      - name: Checkout exact P15 candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify service clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools
          mysql --version
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Verify P15 T008-T012 source boundary
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          python3 -m py_compile scripts/p15/integration.py scripts/p15/case_config_core.py scripts/p15/case_config_security.py
          gofmt -d \
            internal/auth/security_http.go \
            internal/auth/security_redis.go \
            internal/auth/turnstile.go \
            scripts/p15/t008_runner/main.go \
            scripts/p15/t009_runner/main.go \
            scripts/p15/t010_runner/main.go \
            scripts/p15/t011_runner/main.go \
            scripts/p15/t012_runner/main.go | tee /tmp/p15-security-gofmt.diff
          test ! -s /tmp/p15-security-gofmt.diff
          go test ./...
          go vet ./internal/auth ./internal/support
          python3 scripts/p15/validate_contract.py > /tmp/p15-contract-guard.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p15-contract-guard.json',encoding='utf-8'))
          assert data['status']=='PASS',data
          assert data['contract_authority']=='9ba89a42281709087b40cdcf0cb2eebd54952a99',data
          assert data['frozen_contract_preserved'] is True,data
          PY

      - name: Apply immutable migrations through current P15 head
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          for attempt in $(seq 1 60); do
            if mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e 'SELECT VERSION()'
          for migration in migrations/[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying ${migration}"
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root --default-character-set=utf8mb4 gojet_test < "$migration"
          done

      - name: Run frozen P15-T008 driver
        run: python3 scripts/p15/integration.py --case P15-T008 | tee /tmp/p15-t008-result.json
      - name: Run frozen P15-T009 driver
        run: python3 scripts/p15/integration.py --case P15-T009 | tee /tmp/p15-t009-result.json
      - name: Run frozen P15-T010 driver
        run: python3 scripts/p15/integration.py --case P15-T010 | tee /tmp/p15-t010-result.json
      - name: Run frozen P15-T011 driver
        run: python3 scripts/p15/integration.py --case P15-T011 | tee /tmp/p15-t011-result.json
      - name: Run frozen P15-T012 driver
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p15/integration.py --case P15-T012 | tee /tmp/p15-t012-result.json
          head="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths={
              'P15-T008':'artifacts/v10/P15/security/P15-T008.json',
              'P15-T009':'artifacts/v10/P15/security/P15-T009.json',
              'P15-T010':'artifacts/v10/P15/security/P15-T010.json',
              'P15-T011':'artifacts/v10/P15/security/P15-T011.json',
              'P15-T012':'artifacts/v10/P15/security/P15-T012.json',
          }
          for case,path in paths.items():
              data=json.load(open(path,encoding='utf-8'))
              assert data['node']=='P15',data
              assert data['case']==case,data
              assert data['status']=='PASS',data
              assert data['exact_head']==head,(data['exact_head'],head)
              assert data['contract_authority']=='9ba89a42281709087b40cdcf0cb2eebd54952a99',data
              assert data['checks'] and all(data['checks'].values()),data
              assert not any(data['evidence_policy'].values()),data
          PY
          printf 'sha=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Upload exact-head P15 T008-T012 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p15-t008-t012-auth-security-${{ steps.evidence.outputs.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P15/security/P15-T008.json
            artifacts/v10/P15/security/P15-T009.json
            artifacts/v10/P15/security/P15-T010.json
            artifacts/v10/P15/security/P15-T011.json
            artifacts/v10/P15/security/P15-T012.json
            artifacts/v10/P15/test-plan.json
            scripts/p15/case_config_core.py
            scripts/p15/case_config_security.py
