name: P18 Docs Discovery Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/apps/docs/**'
      - 'deploy/nginx/docs-p18.conf'
      - 'scripts/p18/**'
      - 'services/platformapi/cmd/server/admin_access.go'
      - 'internal/admin/api_keys.go'
      - 'artifacts/v10/P18/test-plan.json'
      - 'artifacts/v10/P18/review.md'
      - '.github/workflows/p18-docs-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p18-docs-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: P18 T008-T018 discovery navigation content evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node from repository contract
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate frozen pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Validate P18 contract and build static Docs/Pagefind/sitemaps
        run: |
          set -euo pipefail
          python3 scripts/p18/validate_contract.py > /tmp/p18-contract.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p18-contract.json', encoding='utf-8'))
          assert data['status'] == 'PASS' and data['frozen_contract_preserved'] is True, data
          assert data['implementation_authorized'] is True or data['review_phase'] == 'signed', data
          PY
          pnpm install --frozen-lockfile
          pnpm --filter @gojet/docs typecheck
          pnpm --filter @gojet/docs build
          test -f frontend/apps/docs/dist/pagefind/pagefind.js
          test -f frontend/apps/docs/dist/sitemap-docs-en.xml
          test -f frontend/apps/docs/dist/sitemap-docs-zh-CN.xml
      - name: Start static Nginx fixture
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y nginx; fi
          cat > "$RUNNER_TEMP/p18-nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/p18-nginx.pid;
          events { worker_connections 128; }
          http {
            access_log off;
            error_log $RUNNER_TEMP/p18-nginx-error.log notice;
            server {
              listen 127.0.0.1:8098;
              server_name localhost;
              root $GITHUB_WORKSPACE/frontend/apps/docs/dist;
              include $GITHUB_WORKSPACE/deploy/nginx/docs-p18.conf;
            }
          }
          EOF
          nginx -t -c "$RUNNER_TEMP/p18-nginx.conf"
          nginx -c "$RUNNER_TEMP/p18-nginx.conf"
          for _ in $(seq 1 20); do curl -fsS 'http://127.0.0.1:8098/docs/en/' >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Run frozen T008-T018 in order
        env:
          P18_HTTP_BASE: http://127.0.0.1:8098
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p18/integration.py scripts/p18/core_cases.py scripts/p18/discovery_cases.py scripts/p18/browser.py scripts/p18/postbuild.py
          for n in 008 009 010; do python3 scripts/p18/integration.py --case "P18-T${n}"; done
          python3 scripts/p18/browser.py --case P18-T011
          for n in 012 013 014 015 016 017 018; do python3 scripts/p18/integration.py --case "P18-T${n}"; done
      - name: Record exact-head discovery authority
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          mkdir -p artifacts/v10/P18/discovery
          printf '%s\n' "$head" > artifacts/v10/P18/discovery/implementation_commit.txt
          printf '%s\n' 'P18-T008..P18-T018' > artifacts/v10/P18/discovery/case_range.txt
          cp /tmp/p18-contract.json artifacts/v10/P18/discovery/contract.json
          sha256sum frontend/apps/docs/dist/pagefind/pagefind.js frontend/apps/docs/dist/sitemap-docs-en.xml frontend/apps/docs/dist/sitemap-docs-zh-CN.xml > artifacts/v10/P18/discovery/static-digests.txt
      - name: Upload exact-head P18 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p18-docs-discovery-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P18/search/P18-T008.json
            artifacts/v10/P18/search/P18-T009.json
            artifacts/v10/P18/search/P18-T010.json
            artifacts/v10/P18/browser/P18-T011.json
            artifacts/v10/P18/navigation/P18-T012.json
            artifacts/v10/P18/crawl/P18-T013.json
            artifacts/v10/P18/seo/P18-T014.json
            artifacts/v10/P18/crawl/P18-T015.json
            artifacts/v10/P18/content/P18-T016.json
            artifacts/v10/P18/content/P18-T017.json
            artifacts/v10/P18/api/P18-T018.json
            artifacts/v10/P18/discovery/
      - name: Stop Nginx
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/p18-nginx.pid" ]; then kill "$(cat "$RUNNER_TEMP/p18-nginx.pid")" || true; fi
