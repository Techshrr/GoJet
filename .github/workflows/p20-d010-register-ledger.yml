name: P20 D010 Register Ledger

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p20-d010-register-ledger.yml'

permissions:
  contents: write

concurrency:
  group: p20-d010-register-ledger
  cancel-in-progress: false

jobs:
  register:
    name: Register P20-D010 ledger-only authority
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head with push authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Register D010 and prove ledger-only final tree
        shell: bash
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"
          base_head="$(git rev-parse HEAD^)"
          test "$base_head" = "645f42946d2985f510f7e673137e98f8aff31cb1"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/v10/P20/defect-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema'] == 'gojet.p20-defect-ledger.v1'
          assert data['node'] == 'P20'
          assert data['open'] == [], data['open']
          closed_ids = [item['id'] for item in data['closed']]
          assert closed_ids == [f'P20-D{i:03d}' for i in range(1, 10)], closed_ids
          assert data['decision_required'] == []

          data['open'] = [{
              'id': 'P20-D010',
              'severity': 'P1',
              'title': 'Bio API rejects real authenticated session authority',
              'case': 'P20-T018',
              'issue': 84,
              'release_blocking': True,
              'gate_hard_failure': True,
              'affected_gates': ['G3', 'G6', 'G10'],
              'discovered_head': '645f42946d2985f510f7e673137e98f8aff31cb1',
              'discovery_workflow_run': 33347382280,
              'discovery_workflow_job': 99354001408,
              'discovery_artifact_id': 9742509259,
              'discovery_artifact_digest': 'sha256:12972017746ab764a8b5e4cdf16ddeb47a870cf995359564fd543be23feab0a5',
              'failure': 'real authenticated session is not accepted as Bio API mutation authority; HTTP 503 auth_dependency_unavailable after exact-head P09 scanner, P11 Bio lifecycle/risk/noindex/sitemap authority and P20-T009 through formal P20-T017 all succeeded; durable Bio page row delta 0'
          }]
          data['note'] = (
              'P20-D010 is an open P1 release blocker discovered by exact-head P20-T018 live Bio continuity on '
              '645f42946d2985f510f7e673137e98f8aff31cb1. P20-T019 remains forbidden until D010 is remediated, '
              'formally verified and closed with same-head P20 Contract and Candidate Freeze coherence.'
          )
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/p20-d010-register-ledger.yml

          changed="$(git diff --name-only "$base_head")"
          test "$changed" = "artifacts/v10/P20/defect-ledger.json"

          python3 - <<'PY'
          import json
          data=json.load(open('artifacts/v10/P20/defect-ledger.json', encoding='utf-8'))
          assert len(data['open']) == 1
          d=data['open'][0]
          assert d['id']=='P20-D010' and d['severity']=='P1' and d['issue']==84
          assert d['case']=='P20-T018' and d['release_blocking'] is True and d['gate_hard_failure'] is True
          assert data['decision_required']==[]
          assert len(data['closed'])==9
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/v10/P20/defect-ledger.json .github/workflows/p20-d010-register-ledger.yml
          git commit -m 'P20: register D010 Bio session authority defect'
          git push origin HEAD:develop/p20-whole-product-verification
