name: P20 D013 Product Stage

on:
  push:
    branches:
      - chore/p20-d013-product-stage
    paths:
      - '.github/workflows/p20-d013-product-stage.yml'

permissions:
  contents: write

concurrency:
  group: p20-d013-product-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage D013 Support Admin authority composition
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: chore/p20-d013-product-stage
          fetch-depth: 0
          persist-credentials: true

      - name: Execute corrected frozen D013 product staging block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              '51b3b95178a6100595fb8fd01f53951495ed5b2c:.github/workflows/p20-d013-product-stage.yml'
          ], text=True)
          marker = "      - name: Apply bounded D013 product remediation\n        shell: bash\n        run: |\n"
          assert source.count(marker) == 1
          script = source.split(marker, 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'

          old_sig = 'func buildAdminAccessService(db *sql.DB, redisClient *redis.Client) (*adminaccess.Service, bool, error) {'
          new_sig = 'func buildAdminAccessService(db *sql.DB, redisClient *redis.Client) (*adminaccess.Service, *adminaccess.SecretCipher, bool, error) {'
          start = script.index(old_sig)
          end = script.index('func buildAdminAccessHandler(db *sql.DB, redisClient *redis.Client)', start)
          helper = script[start:end]
          helper = helper.replace(old_sig, new_sig, 1)
          helper = helper.replace('return nil, false,', 'return nil, nil, false,')
          helper = helper.replace('return service, true, nil', 'return service, cipher, true, nil', 1)
          script = script[:start] + helper + script[end:]

          old_call = 'service, enabled, err := buildAdminAccessService(db, redisClient)'
          script = script.replace(old_call, 'service, cipher, enabled, err := buildAdminAccessService(db, redisClient)', 1)
          script = script.replace(old_call, 'service, _, enabled, err := buildAdminAccessService(db, redisClient)', 1)

          Path('/tmp/p20-d013-product-stage.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p20-d013-product-stage.sh
