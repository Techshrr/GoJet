          data=json.load(open('/tmp/p20-d013-contract.json',encoding='utf-8'))
          assert data['status']=='PASS', data
          assert data['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f', data
          assert data['frozen_contract_preserved'] is True, data
          PY

          ! grep -q 'X-GoJet-Test-' services/platformapi/cmd/server/support_admin_auth.go

          cat > /tmp/expected-files <<'EOF'
          services/platformapi/cmd/server/admin_access.go
          services/platformapi/cmd/server/support.go
          services/platformapi/cmd/server/support_admin_auth.go
          services/platformapi/cmd/server/support_admin_auth_test.go
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git add -N services/platformapi/cmd/server/support_admin_auth.go services/platformapi/cmd/server/support_admin_auth_test.go
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/platformapi/cmd/server/admin_access.go \
            services/platformapi/cmd/server/support.go \
            services/platformapi/cmd/server/support_admin_auth.go \
            services/platformapi/cmd/server/support_admin_auth_test.go
          git commit -m 'P20 D013: compose P17 Admin authority into Support'
          commit="$(git rev-parse HEAD)"
          echo "P20_D013_PRODUCT_COMMIT=${commit}"
          git push origin HEAD:develop/p20-d013-support-admin-authority
