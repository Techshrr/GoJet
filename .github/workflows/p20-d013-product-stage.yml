name: P20 D013 Product Stage

on:
  push:
    branches:
      - chore/p20-d013-product-stage
    paths:
      - '.github/workflows/p20-d013-product-stage.yml'

permissions:
  contents: write

concurrency:
  group: p20-d013-product-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage D013 Support Admin authority composition
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: chore/p20-d013-product-stage
          fetch-depth: 0
          persist-credentials: true

      - name: Execute frozen D013 product staging block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              '51b3b95178a6100595fb8fd01f53951495ed5b2c:.github/workflows/p20-d013-product-stage.yml'
          ], text=True)
          marker = "      - name: Apply bounded D013 product remediation\n        shell: bash\n        run: |\n"
          assert source.count(marker) == 1
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          assert lines
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/p20-d013-product-stage.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p20-d013-product-stage.sh
