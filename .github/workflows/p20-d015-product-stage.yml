name: P20 D015 Product Stage

# staging-attempt: 4
on:
  push:
    branches:
      - tmp/p20-d015-product-stage
    paths:
      - '.github/workflows/p20-d015-product-stage.yml'

permissions:
  contents: write

concurrency:
  group: p20-d015-product-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Build and validate bounded D015 remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply bounded product patch
        run: python3 scripts/p20/d015_product_stage.py

      - name: Validate scoped and whole repository code
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test ./internal/auth ./internal/workspace ./internal/billing ./services/platformapi/cmd/server
          go test ./...
          python3 scripts/p13/validate_contract.py > /tmp/p13-contract.json
          python3 scripts/p20/validate_contract.py > /tmp/p20-contract.json
          python3 -c "import json; p=json.load(open('/tmp/p13-contract.json')); assert p['status']=='PASS', p"
          python3 -c "import json; p=json.load(open('/tmp/p20-contract.json')); assert p['status']=='PASS' and p['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f' and p['frozen_contract_preserved'] is True, p"

      - name: Commit tested product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/platformapi/cmd/server/billing.go services/platformapi/cmd/server/billing_session_auth.go services/platformapi/cmd/server/billing_session_auth_test.go services/platformapi/cmd/server/main.go
          git commit -m 'P20 D015: compose real customer session into Billing'
          git push origin HEAD:tmp/p20-d015-product-stage
