name: P20 D015 Product Stage

on:
  push:
    branches:
      - tmp/p20-d015-product-stage
    paths:
      - '.github/workflows/p20-d015-product-stage.yml'

permissions:
  contents: write

concurrency:
  group: p20-d015-product-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Build and validate bounded D015 remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require registered D015 governance base
        shell: bash
        run: |
          set -euo pipefail
          base='11b0d924bdda4f0166f9292af4433ed1fa056b45'
          git merge-base --is-ancestor "$base" HEAD
          python3 - <<'PY'
          import json
          data=json.load(open('artifacts/v10/P20/defect-ledger.json', encoding='utf-8'))
          assert [row['id'] for row in data['open']]==['P20-D015'], data['open']
          assert data['open'][0]['issue']==108 and data['open'][0]['severity']=='P1', data['open'][0]
          PY

      - name: Apply bounded production session composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          billing=Path('services/platformapi/cmd/server/billing.go')
          text=billing.read_text(encoding='utf-8')
          old_import='\t"github.com/Techshrr/GoJet/internal/workspace"\n)'
          new_import='\t"github.com/Techshrr/GoJet/internal/workspace"\n\t"github.com/redis/go-redis/v9"\n)'
          assert old_import in text and new_import not in text
          text=text.replace(old_import,new_import,1)

          old='''func buildBillingHandler(db *sql.DB, testAuth bool) (http.Handler, bool, error) {
\tif os.Getenv("GOJET_BILLING_ENABLED") != "1" {
\t\treturn nil, false, nil
\t}
\tstore := billing.NewStore(db)
\tmembershipStore := workspace.NewStore(db)
\tprincipalResolver := billingPrincipalResolver{testAuth: testAuth}
\tmembershipResolver := billingMembershipResolver{store: membershipStore}
'''
          new='''func buildBillingHandler(db *sql.DB, redisClient *redis.Client, testAuth bool) (http.Handler, bool, error) {
\tif os.Getenv("GOJET_BILLING_ENABLED") != "1" {
\t\treturn nil, false, nil
\t}
\tstore := billing.NewStore(db)
\tmembershipStore := workspace.NewStore(db)
\tvar principalResolver billing.PrincipalResolver
\tif testAuth {
\t\tprincipalResolver = billingPrincipalResolver{testAuth: true}
\t} else {
\t\tsessionResolver, err := buildBillingSessionPrincipalResolver(db, redisClient)
\t\tif err != nil {
\t\t\treturn nil, false, err
\t\t}
\t\tprincipalResolver = sessionResolver
\t}
\tmembershipResolver := billingMembershipResolver{store: membershipStore}
'''
          assert old in text
          text=text.replace(old,new,1)
          billing.write_text(text,encoding='utf-8')

          main=Path('services/platformapi/cmd/server/main.go')
          text=main.read_text(encoding='utf-8')
          old='billingHandler, billingEnabled, err := buildBillingHandler(db, testAuth)'
          new='billingHandler, billingEnabled, err := buildBillingHandler(db, redisClient, testAuth)'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          main.write_text(text,encoding='utf-8')
          PY

          cat > services/platformapi/cmd/server/billing_session_auth.go <<'GO'
          package main

          import (
          	"database/sql"
          	"errors"
          	"net/http"
          	"strings"

          	"github.com/Techshrr/GoJet/internal/billing"
          	"github.com/Techshrr/GoJet/internal/workspace"
          	"github.com/redis/go-redis/v9"
          )

          // billingSessionPrincipalResolver adapts the established P15 customer
          // session boundary to the P13 Billing customer principal contract.
          // Workspace membership and role remain server-authoritative inside Billing.
          type billingSessionPrincipalResolver struct {
          	resolvePrincipal func(*http.Request) (workspace.Principal, error)
          }

          func buildBillingSessionPrincipalResolver(db *sql.DB, redisClient *redis.Client) (*billingSessionPrincipalResolver, error) {
          	if db == nil || redisClient == nil {
          		return nil, billing.ErrAuthenticationUnavailable
          	}
          	workspaceAuthority, err := buildWorkspaceSessionAuthority(db, redisClient)
          	if err != nil {
          		return nil, err
          	}
          	return &billingSessionPrincipalResolver{resolvePrincipal: workspaceAuthority.resolve}, nil
          }

          func (r *billingSessionPrincipalResolver) ResolvePrincipal(req *http.Request) (billing.RequestPrincipal, error) {
          	if r == nil || r.resolvePrincipal == nil || req == nil {
          		return billing.RequestPrincipal{}, billing.ErrAuthenticationUnavailable
          	}
          	principal, err := r.resolvePrincipal(req)
          	if err != nil {
          		return billing.RequestPrincipal{}, billingCustomerAuthorityError(err)
          	}
          	userID := strings.TrimSpace(principal.UserID)
          	email := strings.TrimSpace(principal.Email)
          	if userID == "" || email == "" {
          		return billing.RequestPrincipal{}, billing.ErrAuthenticationUnavailable
          	}
          	return billing.RequestPrincipal{
          		UserID:      userID,
          		Email:       email,
          		DisplayName: strings.TrimSpace(principal.DisplayName),
          	}, nil
          }

          func billingCustomerAuthorityError(err error) error {
          	switch {
          	case errors.Is(err, workspace.ErrAuthenticationRequired), errors.Is(err, workspace.ErrForbidden):
          		// Billing's PrincipalResolver contract has required/unavailable outcomes.
          		// P15 already enforced Origin and one-time CSRF/replay before this map.
          		return billing.ErrAuthenticationRequired
          	default:
          		return billing.ErrAuthenticationUnavailable
          	}
          }
          GO

          cat > services/platformapi/cmd/server/billing_session_auth_test.go <<'GO'
          package main

          import (
          	"errors"
          	"net/http"
          	"testing"

          	"github.com/Techshrr/GoJet/internal/billing"
          	"github.com/Techshrr/GoJet/internal/workspace"
          )

          func TestBillingSessionPrincipalResolverMapsRealPrincipal(t *testing.T) {
          	resolver := &billingSessionPrincipalResolver{
          		resolvePrincipal: func(*http.Request) (workspace.Principal, error) {
          			return workspace.Principal{UserID: "usr_real", Email: "real@example.test", DisplayName: "Real User"}, nil
          		},
          	}
          	req, _ := http.NewRequest(http.MethodGet, "http://localhost/api/workspaces/ws_real/billing", nil)
          	principal, err := resolver.ResolvePrincipal(req)
          	if err != nil {
          		t.Fatalf("ResolvePrincipal() error = %v", err)
          	}
          	if principal.UserID != "usr_real" || principal.Email != "real@example.test" || principal.DisplayName != "Real User" {
          		t.Fatalf("unexpected principal: %#v", principal)
          	}
          }

          func TestBillingSessionPrincipalResolverErrorMapping(t *testing.T) {
          	tests := []struct {
          		name string
          		in   error
          		want error
          	}{
          		{name: "authentication required", in: workspace.ErrAuthenticationRequired, want: billing.ErrAuthenticationRequired},
          		{name: "unsafe request forbidden", in: workspace.ErrForbidden, want: billing.ErrAuthenticationRequired},
          		{name: "dependency unavailable", in: workspace.ErrAuthenticationUnavailable, want: billing.ErrAuthenticationUnavailable},
          		{name: "unknown dependency failure", in: errors.New("boom"), want: billing.ErrAuthenticationUnavailable},
          	}
          	for _, tt := range tests {
          		t.Run(tt.name, func(t *testing.T) {
          			resolver := &billingSessionPrincipalResolver{
          				resolvePrincipal: func(*http.Request) (workspace.Principal, error) { return workspace.Principal{}, tt.in },
          			}
          			req, _ := http.NewRequest(http.MethodPost, "http://localhost/api/workspaces/ws_real/orders", nil)
          			_, err := resolver.ResolvePrincipal(req)
          			if !errors.Is(err, tt.want) {
          				t.Fatalf("ResolvePrincipal() error = %v, want %v", err, tt.want)
          			}
          		})
          	}
          }

          func TestBillingSessionPrincipalResolverRejectsIncompleteAuthority(t *testing.T) {
          	resolver := &billingSessionPrincipalResolver{
          		resolvePrincipal: func(*http.Request) (workspace.Principal, error) {
          			return workspace.Principal{UserID: "usr_real"}, nil
          		},
          	}
          	req, _ := http.NewRequest(http.MethodGet, "http://localhost/api/workspaces/ws_real/billing", nil)
          	_, err := resolver.ResolvePrincipal(req)
          	if !errors.Is(err, billing.ErrAuthenticationUnavailable) {
          		t.Fatalf("ResolvePrincipal() error = %v, want auth unavailable", err)
          	}
          }
          GO

      - name: Format and enforce product boundary
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w services/platformapi/cmd/server/billing.go services/platformapi/cmd/server/billing_session_auth.go services/platformapi/cmd/server/billing_session_auth_test.go services/platformapi/cmd/server/main.go
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            services/platformapi/cmd/server/billing.go
            services/platformapi/cmd/server/billing_session_auth.go
            services/platformapi/cmd/server/billing_session_auth_test.go
            services/platformapi/cmd/server/main.go
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          grep -F 'if testAuth && os.Getenv("GOJET_TEST_BILLING_CALLBACKS_ENABLED") == "1" {' services/platformapi/cmd/server/billing.go
          grep -F 'X-GoJet-Test-Actor' services/platformapi/cmd/server/billing.go

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate scoped and repository-wide code
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test ./internal/auth ./internal/workspace ./internal/billing ./services/platformapi/cmd/server
          go test ./...
          python3 scripts/p13/validate_contract.py > /tmp/p13-contract.json
          python3 scripts/p20/validate_contract.py > /tmp/p20-contract.json
          python3 - <<'PY'
          import json
          p13=json.load(open('/tmp/p13-contract.json', encoding='utf-8'))
          p20=json.load(open('/tmp/p20-contract.json', encoding='utf-8'))
          assert p13['status']=='PASS', p13
          assert p20['status']=='PASS', p20
          assert p20['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f', p20
          assert p20['frozen_contract_preserved'] is True, p20
          PY

      - name: Commit tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/platformapi/cmd/server/billing.go \
                  services/platformapi/cmd/server/billing_session_auth.go \
                  services/platformapi/cmd/server/billing_session_auth_test.go \
                  services/platformapi/cmd/server/main.go
          git commit -m 'P20 D015: compose real customer session into Billing'
          git push origin HEAD:tmp/p20-d015-product-stage
