name: P20 D016 Ledger Registration

on:
  pull_request:
    branches:
      - develop/p20-whole-product-verification
    paths:
      - '.github/workflows/p20-d016-ledger-register.yml'
      - 'artifacts/v10/P20/defect-ledger.json'

permissions:
  contents: write

concurrency:
  group: p20-d016-ledger-register-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  register:
    name: Register P20-D016 ledger-only blocker
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/p20-d016-ledger-register'
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: chore/p20-d016-ledger-register
          fetch-depth: 0
          persist-credentials: true

      - name: Register D016 without rewriting historical evidence
        shell: bash
        run: |
          set -euo pipefail
          base='a71c3741ab0c12dd79ece54c518bf5a5d1e27953'
          test "$(git rev-parse "${base}^{commit}")" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/v10/P20/defect-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema'] == 'gojet.p20-defect-ledger.v1'
          assert data['node'] == 'P20'
          assert data['status'] == 'ACTIVE'
          assert [item['id'] for item in data['open']] == ['P20-D015'], data['open']
          assert data['open'][0]['issue'] == 108
          assert not any(item['id'] == 'P20-D016' for item in data['closed'])

          data['open'].append({
              'id': 'P20-D016',
              'severity': 'P1',
              'title': 'Billing production provider callback verifier is unavailable',
              'case': 'P20-T021',
              'issue': 114,
              'release_blocking': True,
              'gate_hard_failure': True,
              'affected_gates': ['G3', 'G6', 'G10'],
              'discovered_head': 'b18070e479a77c116944a014ba2b21d2c9bf8295',
              'discovery_workflow_run': 34152626763,
              'discovery_workflow_job': 101837877479,
              'discovery_artifact_id': 10029982068,
              'discovery_artifact_digest': 'sha256:4624724c5cc03f200be06eaa93ca964c91c1b444612426da7263db8d6b53bb02',
              'failure': 'real P15 owner can create one pending Billing order and open invoice after D015 remediation, but production provider callback returns HTTP 503 callback_verifier_unavailable with zero callback-event/transaction/billing-grant settlement writes and leaves order/invoice pending/open',
              'disposition': 'OPEN — P20-T021/P20-T022+ blocked pending bounded production provider-callback verifier remediation and formal merged-head closure',
          })
          data['note'] = (
              'P20-D001 through P20-D014 are formally closed. P20-D015 and P20-D016 are open P1 blockers in the frozen P20-T021 Billing workflow: D015 customer-session composition is product-remediated but remains open until formal T021 closure, while D016 records the next fail-fast production callback-verifier boundary. P20-T021 cannot pass and P20-T022+ are forbidden until all T021 blockers are remediated and formal same-head T021, P20 Contract and Candidate Freeze closure coherence prove P0/P1/decision_required = 0/0/0.'
          )
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python3 - <<'PY'
          import json
          data=json.load(open('artifacts/v10/P20/defect-ledger.json',encoding='utf-8'))
          assert [item['id'] for item in data['open']] == ['P20-D015','P20-D016']
          d016=data['open'][1]
          assert d016['issue'] == 114
          assert d016['affected_gates'] == ['G3','G6','G10']
          assert d016['discovered_head'] == 'b18070e479a77c116944a014ba2b21d2c9bf8295'
          assert d016['discovery_workflow_run'] == 34152626763
          assert d016['discovery_workflow_job'] == 101837877479
          assert d016['discovery_artifact_id'] == 10029982068
          assert d016['discovery_artifact_digest'] == 'sha256:4624724c5cc03f200be06eaa93ca964c91c1b444612426da7263db8d6b53bb02'
          PY

      - name: Self-clean and commit ledger-only final tree
        shell: bash
        run: |
          set -euo pipefail
          base='a71c3741ab0c12dd79ece54c518bf5a5d1e27953'
          rm .github/workflows/p20-d016-ledger-register.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'P20 D016: register production callback-verifier blocker'
          mapfile -t final_files < <(git diff --name-only "$base" HEAD)
          test "${#final_files[@]}" -eq 1
          test "${final_files[0]}" = 'artifacts/v10/P20/defect-ledger.json'

          set +e
          python3 scripts/p20/defect_cases.py > /tmp/p20-d016-defect-cases.json
          defect_rc=$?
          set -e
          test "$defect_rc" -ne 0
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p20-d016-defect-cases.json',encoding='utf-8'))
          assert data['status']=='FAIL',data
          assert data['details']['p0_open']==0,data
          assert data['details']['p1_open']==2,data
          assert data['details']['decision_required']==0,data
          assert data['errors']==["open P1 defects: ['P20-D015', 'P20-D016']"],data
          PY

          python3 scripts/p20/validate_contract.py > /tmp/p20-d016-contract.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p20-d016-contract.json',encoding='utf-8'))
          assert data['status']=='PASS',data
          assert data['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f',data
          assert data['frozen_contract_preserved'] is True,data
          PY
          git push origin HEAD:chore/p20-d016-ledger-register
