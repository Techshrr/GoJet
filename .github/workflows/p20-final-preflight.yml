name: P20 Final Candidate Preflight
on:
  push:
    branches: [develop/p20-final-preflight]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native formatter evidence for P20 Go changes
        run: |
          mkdir -p /tmp/p20-preflight
          git diff --name-only -z 54a2881ae0d4dfce5aadfc05ce3b59e8b4b717c6 HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > /tmp/p20-preflight/gofmt.patch
          git rev-parse HEAD > /tmp/p20-preflight/source-head.txt
          sha256sum /tmp/p20-preflight/gofmt.patch > /tmp/p20-preflight/patch.sha256
      - name: Native compile, regression and frozen predecessor validation
        run: |
          go test ./...
          go vet ./internal/links ./internal/logging ./services/redirectengine/cmd/server
          python3 scripts/p16/validate_contract.py
          python3 scripts/p20/validate_contract.py
          python3 -m unittest discover -s scripts/p20 -p 'test*.py'
          go test -race -count=50 ./internal/logreceiver ./internal/logging
      - name: Verify original signed predecessor reports and upload attestations live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.signed_authority import bind
          for node in ('P17', 'P18'):
              proof=bind(node, os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'], '/tmp/p20-preflight/retained-authority')
              print(node, proof['binding_mode'], proof['original_report_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-final-preflight-${{ github.sha }}
          path: /tmp/p20-preflight/
          if-no-files-found: error
          retention-days: 30
