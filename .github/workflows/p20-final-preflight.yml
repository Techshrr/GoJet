name: P20 Final Candidate Preflight
on:
  push:
    branches: [develop/p20-final-preflight]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native formatter evidence for P20 Go changes
        run: |
          mkdir -p /tmp/p20-preflight
          git diff --name-only -z 54a2881ae0d4dfce5aadfc05ce3b59e8b4b717c6 HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > /tmp/p20-preflight/gofmt.patch
          git rev-parse HEAD > /tmp/p20-preflight/source-head.txt
          sha256sum /tmp/p20-preflight/gofmt.patch > /tmp/p20-preflight/patch.sha256
      - name: Native compile, regression and frozen predecessor validation
        run: |
          go test ./...
          go vet ./internal/links ./internal/logging ./services/redirectengine/cmd/server
          python3 scripts/p16/validate_contract.py
          python3 scripts/p20/validate_contract.py
          python3 -m unittest discover -s scripts/p20 -p 'test_release*.py'
          python3 -m unittest discover -s scripts/p20 -p 'test_ci_workflow_pagination.py'
      - name: Verify original signed predecessor reports and upload attestations live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.signed_authority import bind
          for node in ('P17', 'P18'):
              proof=bind(node, os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'], '/tmp/p20-preflight/retained-authority')
              print(node, proof['binding_mode'], proof['original_report_sha256'])
          PY
      - name: Run only affected native regression producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from scripts.ci.actions import github_json, regression_runs
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['GITHUB_SHA']; ref=os.environ['GITHUB_REF_NAME']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          runs=regression_runs(lambda url: github_json(url,headers),repo,head)
          workflows=('p20-p0-support.yml','p16-trust-destination-risk-abuse.yml',
            'p09-integration.yml','p10-integration.yml','p13-integration.yml',
            'p12-browser.yml','p20-t027-consistency.yml')
          for workflow in workflows:
              if any(r['path']=='.github/workflows/'+workflow for r in runs):
                  print('Existing exact-head producer retained:',workflow)
                  continue
              current=subprocess.check_output(['gh','api',f'repos/{repo}/git/ref/heads/{ref}','--jq','.object.sha'],text=True).strip()
              assert current==head
              subprocess.run(['gh','workflow','run',workflow,'--repo',repo,'--ref',ref],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-final-preflight-${{ github.sha }}
          path: /tmp/p20-preflight/
          if-no-files-found: error
          retention-days: 30
