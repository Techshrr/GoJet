name: P20 P0 Support Timeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/p20/p0_timeline.py'
      - 'scripts/p20/t010_runner/**'
      - 'scripts/p20/t011_runner/**'
      - 'scripts/p20/t012_runner/**'
      - 'scripts/p20/t013_runner/**'
      - 'scripts/p20/t014_case.py'
      - 'scripts/p20/t014_probe/**'
      - 'scripts/p20/t015_case.py'
      - 'scripts/p20/t015_probe/**'
      - 'scripts/p20/t016_case.py'
      - 'scripts/p20/t016_probe/**'
      - 'scripts/p20/t017_case.py'
      - 'scripts/p20/t017_probe/**'
      - 'scripts/p20/t018_case.py'
      - 'scripts/p20/t018_probe/**'
      - 'scripts/p20/t019_probe/**'
      - 'scripts/p20/t019_case.py'
      - 'scripts/p20/t019_formal_probe/**'
      - 'scripts/p20/t020_probe/**'
      - 'scripts/p20/common.py'
      - 'scripts/p20/validate_contract.py'
      - 'scripts/p09/integration*.py'
      - 'scripts/p09/clamd_fault_server.py'
      - 'scripts/p10/**'
      - 'scripts/p11/**'
      - 'scripts/p06/**'
      - 'scripts/p17/integration.py'
      - 'scripts/p17/domain_case_runner/**'
      - 'scripts/p14/**'
      - 'services/platformapi/cmd/server/**'
      - 'services/platformapi/cmd/fileworker/**'
      - 'services/redirectengine/cmd/server/**'
      - 'services/analyticsworker/**'
      - 'services/analyticsreconciler/**'
      - 'internal/auth/**'
      - 'internal/workspace/**'
      - 'internal/links/**'
      - 'internal/analytics/**'
      - 'internal/qr/**'
      - 'internal/files/**'
      - 'internal/text/**'
      - 'internal/bio/**'
      - 'internal/domains/**'
      - 'internal/support/**'
      - 'internal/securetoken/**'
      - 'migrations/**'
      - 'artifacts/v10/P20/test-plan.json'
      - 'artifacts/v10/P20/defect-ledger.json'
      - '.github/workflows/p20-p0-bio.yml'
      - '.github/workflows/p20-p0-bio-formal.yml'
      - '.github/workflows/p20-p0-domain.yml'
      - '.github/workflows/p20-p0-support.yml'
      - '.github/workflows/p14-integration.yml'
      - '.github/workflows/p20-p0-text-formal.yml'
      - '.github/workflows/p20-p0-files-formal.yml'
      - '.github/workflows/p20-candidate-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p20-p0-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  t009-t020-live:
    name: P20-T009/T020 real Support live timeline
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      GOJET_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gojet_test?multiStatements=true&parseTime=true&charset=utf8mb4
      GOJET_REDIS_ADDR: 127.0.0.1:6379
      GOJET_PLATFORMAPI_ADDR: 127.0.0.1:18081
      GOJET_P20_API_BASE: http://127.0.0.1:18081
      GOJET_REDIRECTENGINE_ADDR: 127.0.0.1:18080
      GOJET_P20_REDIRECT_BASE: http://127.0.0.1:18080
      GOJET_ANALYTICS_ENABLED: '1'
      GOJET_QR_WORKSPACE_QUOTA: '10'
      GOJET_TEST_ROUTING_HEADERS: '0'
      GOJET_AUTH_ENABLED: '1'
      GOJET_AUTH_RATE_LIMIT: '6'
      GOJET_AUTH_RATE_WINDOW_SECONDS: '60'
      GOJET_ACCOUNT_ENABLED: '1'
      GOJET_WORKSPACE_ENABLED: '1'
      GOJET_TEST_AUTH_ENABLED: '0'
      GOJET_AUTH_ALLOWED_ORIGIN: http://localhost:4185
      GOJET_AUTH_CSRF_KEY_HEX: 102132435465768798a9babbdcddfe0f00112233445566778899aabbccddeeff
      GOJET_AUTH_GRANT_KEY_ID: p20-t009-grant-v1
      GOJET_AUTH_GRANT_KEY_HEX: 00112233445566778899aabbccddeeff102132435465768798a9babbdcddfe0f
      GOJET_OAUTH_KEY_ID: p20-t009-oauth-v1
      GOJET_OAUTH_KEY_HEX: 89abcdef0123456776543210fedcba98102132435465768798a9babbdcddfe0f
      GOJET_FILES_ENABLED: '1'
      GOJET_FILE_WORKSPACE_MAX_FILES: '20'
      GOJET_FILE_WORKSPACE_MAX_BYTES: '4194304'
      GOJET_FILE_MAX_UPLOAD_BYTES: '1048576'
      GOJET_FILE_STORAGE_ROOT: /tmp/gojet-p20/files
      GOJET_FILE_TYPE_ALLOWLIST: txt=text/plain
      GOJET_FILE_PUBLIC_AUTH_SECRET: p20-t016-integration-secret-0123456789abcdef
      GOJET_CLAMAV_NETWORK: tcp
      GOJET_CLAMAV_ADDRESS: 127.0.0.1:3310
      GOJET_CLAMAV_DIAL_TIMEOUT: 1s
      GOJET_CLAMAV_SCAN_TIMEOUT: 10s
      GOJET_CLAMAV_MAX_SIGNATURE_AGE: 72h
      GOJET_FILE_SCAN_CLAIM_LEASE: 2s
      GOJET_FILE_WORKER_POLL_INTERVAL: 50ms
      GOJET_TEXT_ENABLED: '1'
      GOJET_TEXT_WORKSPACE_QUOTA: '20'
      GOJET_TEXT_PUBLIC_AUTH_SECRET: p20-t017-public-auth-secret-0123456789abcdef
      GOJET_BIO_ENABLED: '1'
      GOJET_BIO_WORKSPACE_QUOTA: '20'
      GOJET_SUPPORT_ENABLED: '1'
      GOJET_TURNSTILE_SECRET: p20-t020-ci-placeholder-not-a-production-secret
      GOJET_SUPPORT_RATE_LIMIT: '20'
      GOJET_SUPPORT_RATE_WINDOW: 5m
      GOJET_SUPPORT_TURNSTILE_REPLAY_TTL: 10m
      GOJET_TEST_SUPPORT_TURNSTILE_ENABLED: '1'
      GOJET_TEST_SUPPORT_TURNSTILE_TOKEN: p20-t020-deterministic-turnstile
      GOJET_TEST_SUPPORT_TICKETS_ADMIN_ENABLED: '1'
      GOJET_TEST_SUPPORT_TICKETS_ADMIN_ACTOR: p14-ticket-admin
      GOJET_TEST_SUPPORT_MAIL_ADMIN_ENABLED: '1'
      GOJET_TEST_SUPPORT_MAIL_ADMIN_ACTOR: p14-mail-admin
      GOJET_TEST_P14_PRODUCER: /tmp/gojet-p20-p14-producer
      GOJET_TEST_P14_MAILWORKER: /tmp/gojet-p20-mailworker
      GOJET_TEST_P14_ATTACHMENT_ROOT: /tmp/gojet-p20/p14-attachments
      GOJET_TEST_P14_ATTACHMENT_POLICY: txt=text/plain
      GOJET_TEST_P14_ATTACHMENT_MAX_BYTES: '65536'
      GOJET_TEST_P14_CLAMAV_NETWORK: tcp
      GOJET_TEST_P14_CLAMAV_ADDRESS: 127.0.0.1:3310
      GOJET_TEST_P14_CLAMAV_DIAL_TIMEOUT: 2s
      GOJET_TEST_P14_CLAMAV_SCAN_TIMEOUT: 5s
      GOJET_TEST_P14_CLAMAV_MAX_SIGNATURE_AGE: 48h
      GOJET_TEST_P14_SMTP_STATE: /tmp/gojet-p20/p14-smtp-state.json
      GOJET_TEST_P14_SMTP_MODE: /tmp/gojet-p20/p14-smtp-mode
      GOJET_TEST_P14_TMP: /tmp/gojet-p20
      GOJET_SMTP_ADDR: 127.0.0.1:2525
      GOJET_SMTP_FROM: no-reply@gojet.local
      GOJET_MAILWORKER_INTERVAL: 250ms
      GOJET_TEST_MYSQL_HOST: 127.0.0.1
      GOJET_TEST_MYSQL_PORT: '3306'
      GOJET_TEST_MYSQL_USER: root
      GOJET_TEST_MYSQL_PASSWORD: root
      GOJET_TEST_MYSQL_DATABASE: gojet_test
      GOJET_TEST_REDIS_HOST: 127.0.0.1
      GOJET_TEST_REDIS_PORT: '6379'
      GOJET_TEST_PLATFORM_URL: http://127.0.0.1:18082
      GOJET_P09_FILEWORKER: /tmp/gojet-p20-fileworker
      GOJET_P09_REAL_CLAMD_ADDRESS: 127.0.0.1:3310
      GOJET_P09_FAULT_SERVER: scripts/p09/clamd_fault_server.py
      GOJET_P20_ANALYTICS_WORKER_BIN: /tmp/gojet-p20-analyticsworker
      GOJET_P20_ANALYTICS_RECONCILER_BIN: /tmp/gojet-p20-analyticsreconciler
      GOJET_P20_FILEWORKER_BIN: /tmp/gojet-p20-fileworker
      GOJET_P20_T014_PROBE_OUT: artifacts/v10/P20/runtime/t014/probe.json
      GOJET_P20_T015_PROBE_OUT: artifacts/v10/P20/runtime/t015/probe.json
      GOJET_P20_T016_PROBE_OUT: artifacts/v10/P20/runtime/t016/probe.json
      GOJET_P20_T017_PROBE_OUT: artifacts/v10/P20/runtime/t017/probe.json
      GOJET_P20_T018_PROBE_OUT: artifacts/v10/P20/runtime/t018/probe.json
      GOJET_P20_T019_PROBE_OUT: artifacts/v10/P20/runtime/t019/probe.json
      GOJET_P20_T020_PROBE_OUT: artifacts/v10/P20/runtime/t020/probe.json

    steps:
      - name: Checkout exact P20 candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native runtime, ClamAV and QR decoder clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client redis-tools clamav clamav-daemon clamav-freshclam zbar-tools librsvg2-bin
          mysql --version
          redis-cli -h 127.0.0.1 -p 6379 ping
          clamd --version
          freshclam --version
          zbarimg --version
          rsvg-convert --version

      - name: Verify T019 source and frozen contract boundary
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          python3 -m py_compile scripts/p20/common.py scripts/p20/p0_timeline.py scripts/p20/t014_case.py scripts/p20/t015_case.py scripts/p20/t016_case.py scripts/p20/t017_case.py scripts/p20/t018_case.py scripts/p20/t019_case.py scripts/p20/validate_contract.py scripts/p06/integration.py scripts/p17/integration.py scripts/p09/integration*.py scripts/p09/clamd_fault_server.py scripts/p10/integration_common.py scripts/p10/integration.py scripts/p10/seo.py scripts/p10/validate_contract.py scripts/p11/integration_common.py scripts/p11/integration.py scripts/p11/seo.py scripts/p11/validate_contract.py
          gofmt -d scripts/p20/t010_runner/main.go scripts/p20/t011_runner/main.go scripts/p20/t012_runner/main.go scripts/p20/t013_runner/main.go scripts/p20/t014_probe/main.go scripts/p20/t015_probe/main.go scripts/p20/t016_probe/main.go scripts/p20/t017_probe/main.go scripts/p20/t018_probe/main.go scripts/p20/t019_probe/main.go scripts/p20/t019_formal_probe/main.go scripts/p20/t020_probe/main.go | tee /tmp/p20-t020-gofmt.diff
          test ! -s /tmp/p20-t020-gofmt.diff
          go test ./internal/auth ./internal/workspace ./internal/links ./internal/analytics ./internal/qr ./internal/files ./internal/text ./internal/bio ./internal/domains ./internal/support ./services/platformapi/cmd/server ./services/platformapi/cmd/fileworker ./services/redirectengine/cmd/server ./services/analyticsworker/cmd/worker ./services/analyticsreconciler/cmd/reconciler ./scripts/p20/t010_runner ./scripts/p20/t011_runner ./scripts/p20/t012_runner ./scripts/p20/t013_runner ./scripts/p20/t014_probe ./scripts/p20/t015_probe ./scripts/p20/t016_probe ./scripts/p20/t017_probe ./scripts/p20/t018_probe ./scripts/p20/t019_probe ./scripts/p20/t019_formal_probe ./scripts/p20/t020_probe
          python3 scripts/p20/validate_contract.py > /tmp/p20-contract-guard.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p20-contract-guard.json',encoding='utf-8'))
          assert data['status']=='PASS',data
          assert data['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f',data
          assert data['frozen_contract_preserved'] is True,data
          PY
          python3 scripts/p10/validate_contract.py > /tmp/p10-contract-guard.json
          python3 scripts/p11/validate_contract.py > /tmp/p11-contract-guard.json

      - name: Apply immutable migrations through exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          for attempt in $(seq 1 60); do
            if mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e 'SELECT VERSION()'
          for migration in migrations/[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying ${migration}"
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root --default-character-set=utf8mb4 gojet_test < "$migration"
          done

      - name: Ensure current ClamAV signatures and start native clamd
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet-p20 /tmp/gojet-p20/p14-attachments artifacts/v10/P20/runtime/t016 artifacts/v10/P20/runtime/t017 artifacts/v10/P20/runtime/t018 artifacts/v10/P20/runtime/t020 artifacts/v10/P09/clamav artifacts/v10/P11/api artifacts/v10/P11/headers artifacts/v10/P11/sitemap artifacts/v10/P14/runtime artifacts/v10/P14/results
          sudo systemctl stop clamav-freshclam.service clamav-daemon.service clamav-daemon.socket 2>/dev/null || true
          refreshed=0
          for attempt in 1 2 3; do
            if sudo freshclam --stdout 2>&1 | tee "artifacts/v10/P20/runtime/t016/freshclam-attempt-${attempt}.log"; then
              refreshed=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$refreshed" -ne 1 ]; then
            echo 'freshclam did not refresh during this run; validating installed signature database' >&2
          fi
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"
          cat > /tmp/gojet-p20/clamd.conf <<'CLAMD'
          Foreground true
          TCPSocket 3310
          TCPAddr 127.0.0.1
          DatabaseDirectory /var/lib/clamav
          LogTime true
          LogFile /tmp/gojet-p20/clamd.log
          PidFile /tmp/gojet-p20/clamd.pid
          MaxFileSize 100M
          MaxScanSize 100M
          StreamMaxLength 100M
          CLAMD
          clamd --config-file=/tmp/gojet-p20/clamd.conf > artifacts/v10/P20/runtime/t016/clamd-stdout.log 2>&1 &
          echo $! > artifacts/v10/P20/runtime/t016/clamd.pid
          python3 - <<'PY'
          import socket, time
          deadline = time.monotonic() + 30
          last = None
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 3310), timeout=1) as sock:
                      sock.sendall(b'zVERSION\0')
                      data = sock.recv(4096)
                      if data:
                          text=data.rstrip(b'\0').decode('utf-8','replace')
                          print(text)
                          open('artifacts/v10/P20/runtime/t016/clamd-version.txt','w',encoding='utf-8').write(text+'\n')
                          raise SystemExit(0)
              except OSError as exc:
                  last = exc
                  time.sleep(1)
          raise SystemExit(f'clamd did not become ready: {last}')
          PY

      - name: Build exact-head native services and fileworker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P20/runtime/t009 artifacts/v10/P20/runtime/t013 artifacts/v10/P20/runtime/t014 artifacts/v10/P20/runtime/t015 artifacts/v10/P20/runtime/t016 artifacts/v10/P20/runtime/t017 artifacts/v10/P20/runtime/t018 artifacts/v10/P20/runtime/t019
          go build -trimpath -o /tmp/gojet-p20-platformapi ./services/platformapi/cmd/server
          go build -trimpath -o /tmp/gojet-p20-fileworker ./services/platformapi/cmd/fileworker
          go build -trimpath -o /tmp/gojet-p20-redirectengine ./services/redirectengine/cmd/server
          go build -trimpath -o /tmp/gojet-p20-analyticsworker ./services/analyticsworker/cmd/worker
          go build -trimpath -o /tmp/gojet-p20-analyticsreconciler ./services/analyticsreconciler/cmd/reconciler
          go build -trimpath -o /tmp/gojet-p20-mailworker ./services/platformapi/cmd/mailworker
          go build -trimpath -o /tmp/gojet-p20-p14-producer ./scripts/p14/producer.go
          sha256sum /tmp/gojet-p20-platformapi /tmp/gojet-p20-fileworker > artifacts/v10/P20/runtime/t016/native-files-binaries.sha256
          sha256sum /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t009/native-platformapi.sha256
          sha256sum /tmp/gojet-p20-redirectengine > artifacts/v10/P20/runtime/t013/native-redirectengine.sha256
          sha256sum /tmp/gojet-p20-analyticsworker /tmp/gojet-p20-analyticsreconciler > artifacts/v10/P20/runtime/t014/native-analytics.sha256
          sha256sum /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t017/native-platformapi.sha256
          sha256sum /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t018/native-platformapi.sha256
          sha256sum /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t019/native-platformapi.sha256

      - name: Prove exact-head P09 scanner and P11 Bio predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GOJET_FILE_STORAGE_ROOT"
          mkdir -p "$GOJET_FILE_STORAGE_ROOT"
          GOJET_PLATFORMAPI_ADDR=127.0.0.1:18082 GOJET_TEST_AUTH_ENABLED=1 /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t018/test-auth-platformapi.log 2>&1 &
          echo $! > artifacts/v10/P20/runtime/t018/test-auth-platformapi.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              cat artifacts/v10/P20/runtime/t018/test-auth-platformapi.log || true
              exit 1
            fi
            sleep 1
          done
          exact_head="$(git rev-parse HEAD)"
          for case in P09-T005 P09-T006 P09-T007 P09-T008 P09-T009 P09-T010; do
            echo "Running ${case} as T018 scanner predecessor authority"
            GITHUB_SHA="$exact_head" python3 scripts/p09/integration.py --case "$case"
          done
          for case in P11-T006 P11-T008 P11-T009 P11-T010; do
            echo "Running ${case} as T018 Bio predecessor authority"
            GITHUB_SHA="$exact_head" python3 scripts/p11/integration.py --case "$case"
          done
          for case in P11-T013 P11-T014; do
            echo "Running ${case} as T018 Bio public/noindex predecessor authority"
            GITHUB_SHA="$exact_head" python3 scripts/p11/seo.py --case "$case"
          done
          kill "$(cat artifacts/v10/P20/runtime/t018/test-auth-platformapi.pid)" 2>/dev/null || true
          wait "$(cat artifacts/v10/P20/runtime/t018/test-auth-platformapi.pid)" 2>/dev/null || true
          export MYSQL_PWD=root
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root gojet_test <<'SQL'
          SET FOREIGN_KEY_CHECKS=0;
          TRUNCATE TABLE file_audit_events;
          TRUNCATE TABLE file_scan_attempts;
          TRUNCATE TABLE files;
          TRUNCATE TABLE file_workspace_counters;
          SET FOREIGN_KEY_CHECKS=1;
          SQL
          rm -rf "$GOJET_FILE_STORAGE_ROOT"
          mkdir -p "$GOJET_FILE_STORAGE_ROOT"

      - name: Prove exact-head P14 Support Mail attachment predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          mkdir -p artifacts/v10/P14/api artifacts/v10/P14/rbac artifacts/v10/P14/security artifacts/v10/P14/entitlement artifacts/v10/P14/mail artifacts/v10/P14/notification artifacts/v10/P14/audit artifacts/v10/P14/runtime artifacts/v10/P14/results /tmp/gojet-p20/p14-attachments
          printf '%s\n' success > "$GOJET_TEST_P14_SMTP_MODE"
          python3 scripts/p14/smtp_sink.py --host 127.0.0.1 --port 2525 --state "$GOJET_TEST_P14_SMTP_STATE" --mode-file "$GOJET_TEST_P14_SMTP_MODE" > /tmp/gojet-p20/p14-smtp.log 2>&1 &
          echo $! > /tmp/gojet-p20/p14-smtp.pid
          python3 - <<'READY'
          import socket,time
          deadline=time.monotonic()+15
          while time.monotonic()<deadline:
              try:
                  with socket.create_connection(('127.0.0.1',2525),timeout=1) as s:
                      if s.recv(1024).startswith(b'220 '):
                          raise SystemExit(0)
              except OSError:
                  time.sleep(.25)
          raise SystemExit('P14 SMTP sink not ready')
          READY
          GOJET_PLATFORMAPI_ADDR=127.0.0.1:18082 GOJET_TEST_AUTH_ENABLED=1 /tmp/gojet-p20-platformapi > /tmp/gojet-p20/p14-platformapi.log 2>&1 &
          echo $! > /tmp/gojet-p20/p14-platformapi.pid
          python3 - <<'READY'
          import http.client,time
          deadline=time.monotonic()+20
          last=None
          while time.monotonic()<deadline:
              try:
                  c=http.client.HTTPConnection('127.0.0.1',18082,timeout=1)
                  c.request('GET','/api/support/tickets?workspace_id=probe')
                  r=c.getresponse(); r.read(); status=r.status; c.close()
                  if status==401:
                      raise SystemExit(0)
                  last=status
              except Exception as exc:
                  last=exc
              time.sleep(.25)
          raise SystemExit(f'P14 test platformapi not ready: {last}')
          READY
          for index in $(seq 1 21); do
            case_id="$(printf 'P14-T%03d' "$index")"
            echo "Running ${case_id} as T020 predecessor authority"
            GITHUB_SHA="$exact_head" python3 scripts/p14/integration.py --case "$case_id"
          done
          P14_HEAD="$exact_head" python3 - <<'VERIFY'
          import json,os
          from pathlib import Path
          root=Path('artifacts/v10/P14')
          mapping={1:'api',2:'rbac',3:'api',4:'security',5:'entitlement',6:'entitlement',7:'entitlement',8:'security',9:'security',10:'security',11:'security',12:'security',13:'api',14:'mail',15:'mail',16:'mail',17:'mail',18:'notification',19:'rbac',20:'api',21:'audit'}
          head=os.environ['P14_HEAD']; cases=[]
          for i in range(1,22):
              cid=f'P14-T{i:03d}'
              d=json.loads((root/mapping[i]/f'{cid}.json').read_text(encoding='utf-8'))
              assert d['case_id']==cid and d['status']=='PASS' and d['implementation_commit']==head and d['errors']==[],d
              cases.append({'case_id':cid,'status':'PASS','implementation_commit':head})
          (root/'results'/'integration-summary.json').write_text(json.dumps({'node':'P14','implementation_commit':head,'case_range':'P14-T001..P14-T021','status':'PASS','cases':cases,'errors':[]},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          VERIFY
          kill "$(cat /tmp/gojet-p20/p14-platformapi.pid)" 2>/dev/null || true
          wait "$(cat /tmp/gojet-p20/p14-platformapi.pid)" 2>/dev/null || true
          kill "$(cat /tmp/gojet-p20/p14-smtp.pid)" 2>/dev/null || true
          wait "$(cat /tmp/gojet-p20/p14-smtp.pid)" 2>/dev/null || true

      - name: Prove exact-head P06 and P17 custom-domain predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          exact_head="$(git rev-parse HEAD)"
          mkdir -p artifacts/v10/P06/results artifacts/v10/P17/domain artifacts/v10/P20/runtime/t019

          for case in P06-T002 P06-T009 P06-T010 P06-T011 P06-T012 P06-T013 P06-T014 P06-T018; do
            echo "Running ${case} as T019 custom-domain predecessor authority"
            GITHUB_SHA="$exact_head" python3 scripts/p06/integration.py --case "$case"
          done

          export MYSQL_PWD=root
          for n in 8 9; do
            case_id="$(printf 'P17-T%03d' "$n")"
            echo "Preparing pristine durable authority for ${case_id}"
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e "DROP DATABASE IF EXISTS gojet_test; CREATE DATABASE gojet_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
            for migration in migrations/[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
              mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root --default-character-set=utf8mb4 gojet_test < "$migration"
            done
            redis-cli -h 127.0.0.1 -p 6379 FLUSHDB >/dev/null
            GITHUB_SHA="$exact_head" python3 scripts/p17/integration.py --case "$case_id"
          done

          EXACT_HEAD="$exact_head" python3 - <<'PRED'
          import json, os
          from pathlib import Path
          head=os.environ['EXACT_HEAD']
          p06=['P06-T002','P06-T009','P06-T010','P06-T011','P06-T012','P06-T013','P06-T014','P06-T018']
          for case in p06:
              data=json.loads((Path('artifacts/v10/P06/results')/f'{case}.json').read_text(encoding='utf-8'))
              assert data['status']=='PASS',data
              assert data['implementation_commit']==head,data
              assert data['errors']==[],data
          for case in ('P17-T008','P17-T009'):
              data=json.loads((Path('artifacts/v10/P17/domain')/f'{case}.json').read_text(encoding='utf-8'))
              assert data['node']=='P17',data
              assert data['case']==case,data
              assert data['status']=='PASS',data
              assert data['exact_head']==head,(data['exact_head'],head)
              assert data['contract_authority']=='30174f40df28678360f644b8fed79736906b0ea0',data
              assert data['checks'] and all(data['checks'].values()),data
              assert data['environment']['mysql_version'],data
              assert data['environment']['redis_version'],data
              assert data['environment']['mysql']=='real MySQL 8.x service',data
              assert data['environment']['redis']=='real Redis 7.x service',data
              assert not any(data['evidence_policy'].values()),data
          PRED

          echo 'Resetting durable state for the correlated P20 timeline'
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e "DROP DATABASE IF EXISTS gojet_test; CREATE DATABASE gojet_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          for migration in migrations/[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root --default-character-set=utf8mb4 gojet_test < "$migration"
          done
          redis-cli -h 127.0.0.1 -p 6379 FLUSHDB >/dev/null
          rm -rf "$GOJET_FILE_STORAGE_ROOT"
          mkdir -p "$GOJET_FILE_STORAGE_ROOT"

      - name: Start exact-head native P20 services
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gojet-p20-platformapi > artifacts/v10/P20/runtime/t009/platformapi.log 2>&1 &
          echo $! > artifacts/v10/P20/runtime/t009/platformapi.pid
          /tmp/gojet-p20-redirectengine > artifacts/v10/P20/runtime/t013/redirectengine.log 2>&1 &
          echo $! > artifacts/v10/P20/runtime/t013/redirectengine.pid
          platform_ready=0
          redirect_ready=0
          for attempt in $(seq 1 60); do
            platform_status="$(curl -sS -o /tmp/p20-me.json -w '%{http_code}' http://127.0.0.1:18081/api/me || true)"
            redirect_status="$(curl -sS -o /tmp/p20-redirect-health -w '%{http_code}' http://127.0.0.1:18080/healthz || true)"
            [ "$platform_status" = 401 ] && platform_ready=1
            [ "$redirect_status" = 204 ] && redirect_ready=1
            if [ "$platform_ready" = 1 ] && [ "$redirect_ready" = 1 ]; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/v10/P20/runtime/t009/platformapi.log || true
          cat artifacts/v10/P20/runtime/t013/redirectengine.log || true
          exit 1

