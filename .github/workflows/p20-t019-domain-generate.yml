name: P20 T019 Domain Workflow Generate

on:
  push:
    branches:
      - tmp/p20-t019-domain-workflow
    paths:
      - '.github/workflows/p20-t019-domain-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          ref: tmp/p20-t019-domain-workflow
          path: generator
          fetch-depth: 0

      - name: Checkout exact P20 integration branch
        uses: actions/checkout@v4
        with:
          ref: develop/p20-whole-product-verification
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and validate T019 workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = '5aaeb129c23c671636e759eaf990413542a674c0'
          python3 generator/scripts/p20_t019_generate_workflow.py repo
          test -f repo/.github/workflows/p20-p0-domain.yml
          grep -F 'name: P20 P0 Domain Timeline' repo/.github/workflows/p20-p0-domain.yml
          grep -F 'P20-T009/T019 real custom-domain timeline' repo/.github/workflows/p20-p0-domain.yml
          grep -F 'P20-T019 custom-domain live probe' repo/.github/workflows/p20-p0-domain.yml
          grep -F 'P17-T008' repo/.github/workflows/p20-p0-domain.yml
          grep -F 'P06-T018' repo/.github/workflows/p20-p0-domain.yml
          git -C repo diff --check
          test "$(git -C repo status --porcelain | wc -l | tr -d ' ')" = '1'
          test "$(git -C repo status --porcelain)" = '?? .github/workflows/p20-p0-domain.yml'
          sha256sum repo/.github/workflows/p20-p0-domain.yml | tee /tmp/p20-t019-workflow.sha256

      - name: Upload validated T019 workflow
        uses: actions/upload-artifact@v4
        with:
          name: p20-t019-domain-workflow
          path: repo/.github/workflows/p20-p0-domain.yml
          if-no-files-found: error
          retention-days: 7

      - name: Persist identical validated blob on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generator/staging
          cp repo/.github/workflows/p20-p0-domain.yml generator/staging/p20-p0-domain.yml.generated
          test "$(sha256sum generator/staging/p20-p0-domain.yml.generated | awk '{print $1}')" = '0e2bb364e9029d7ccf7c175f83f1ec157fc6279d507fe4ff5919be559ae41bac'
          git -C generator config user.name 'Ethan H.'
          git -C generator config user.email '118724895+Techshrr@users.noreply.github.com'
          git -C generator add staging/p20-p0-domain.yml.generated
          git -C generator diff --cached --check
          git -C generator commit -m 'P20 T019: stage validated Domain workflow blob'
          git -C generator push origin HEAD:tmp/p20-t019-domain-workflow
