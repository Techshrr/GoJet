name: P20 T019 Probe Gofmt Stage

on:
  push:
    branches:
      - tmp/p20-t019-domain-workflow
    paths:
      - '.github/workflows/p20-t019-domain-generate.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: tmp/p20-t019-domain-workflow
          path: staging-repo
          fetch-depth: 0

      - name: Checkout exact P20 head
        uses: actions/checkout@v4
        with:
          ref: develop/p20-whole-product-verification
          path: p20
          fetch-depth: 0
          persist-credentials: false

      - name: Gofmt exact T019 probe only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C p20 rev-parse HEAD)" = '125e1f982af3ad4ff51b03079bd8a4f9db41fd75'
          gofmt -w p20/scripts/p20/t019_probe/main.go
          git -C p20 diff --check
          test "$(git -C p20 diff --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git -C p20 diff --name-only)" = 'scripts/p20/t019_probe/main.go'
          test -z "$(gofmt -d p20/scripts/p20/t019_probe/main.go)"

      - name: Persist formatted probe blob on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-repo/staging
          cp p20/scripts/p20/t019_probe/main.go staging-repo/staging/p20-t019-probe.go.formatted
          git -C staging-repo config user.name 'Ethan H.'
          git -C staging-repo config user.email '118724895+Techshrr@users.noreply.github.com'
          git -C staging-repo add staging/p20-t019-probe.go.formatted
          git -C staging-repo diff --cached --check
          git -C staging-repo commit -m 'P20 T019: stage gofmt probe blob'
          git -C staging-repo push origin HEAD:tmp/p20-t019-domain-workflow
