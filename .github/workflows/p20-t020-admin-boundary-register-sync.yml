name: P20 T020 Admin Boundary Harness Sync

on:
  push:
    branches:
      - chore/p20-t020-admin-boundary-register
    paths:
      - '.github/workflows/p20-t020-admin-boundary-register-sync.yml'

permissions:
  contents: write

concurrency:
  group: p20-t020-admin-boundary-register-sync
  cancel-in-progress: false

jobs:
  register:
    name: Execute audited T020 Admin boundary staging block
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: chore/p20-t020-admin-boundary-register
          fetch-depth: 0
          persist-credentials: true

      - name: Extract audited staging block and run on exact integration base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p20-t020-admin-boundary-register.yml').read_text(encoding='utf-8')
          marker = "      - name: Apply bounded T020 harness extension\n        shell: bash\n        run: |\n"
          assert source.count(marker) == 1
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          assert lines
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          gofmt_guard = 'gofmt -d scripts/p20/t020_probe/main.go scripts/p20/t020_probe/admin_authority.go | tee /tmp/t020-admin-boundary-gofmt.diff'
          assert script.count(gofmt_guard) == 1
          script = script.replace(gofmt_guard, 'gofmt -w scripts/p20/t020_probe/main.go scripts/p20/t020_probe/admin_authority.go\n' + gofmt_guard, 1)
          Path('/tmp/p20-t020-admin-boundary-register.sh').write_text(script, encoding='utf-8')
          PY
          git fetch origin develop/p20-whole-product-verification
          git checkout --detach origin/develop/p20-whole-product-verification

          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/p20-p0-support.yml')
          text = workflow.read_text(encoding='utf-8')
          old_secret = "      GOJET_TURNSTILE_SECRET: $" + "{{ secrets.P20_TURNSTILE_TEST_SECRET }}\n"
          new_secret = "      GOJET_TURNSTILE_SECRET: 1x0000000000000000000000000000000AA\n"
          assert text.count(old_secret) == 1
          text = text.replace(old_secret, new_secret, 1)
          old_preflight = '\n'.join([
              '      - name: Require isolated Turnstile CI test secret',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          if [ -z "${GOJET_TURNSTILE_SECRET:-}" ]; then',
              "            echo 'P20_TURNSTILE_TEST_SECRET repository secret is required for production-mode T020 Siteverify authority' >&2",
              '            exit 1',
              '          fi',
              '          test "$GOJET_TEST_AUTH_ENABLED" = \'0\'',
          ]) + '\n'
          new_preflight = '\n'.join([
              '      - name: Require official isolated Turnstile CI test credential',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          test "$GOJET_TURNSTILE_SECRET" = \'1x0000000000000000000000000000000AA\'',
              '          test "$GOJET_TEST_AUTH_ENABLED" = \'0\'',
          ]) + '\n'
          assert text.count(old_preflight) == 1
          text = text.replace(old_preflight, new_preflight, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

          bash /tmp/p20-t020-admin-boundary-register.sh
