name: P20 T020 Discovery Stage

on:
  push:
    branches:
      - tmp/p20-t020-discovery
    paths:
      - 'scripts/p20/t020_probe/**'
      - 'scripts/p20_t020_generate_workflow.py'
      - '.github/workflows/p20-t020-discovery-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout discovery branch
        uses: actions/checkout@v4
        with:
          ref: tmp/p20-t020-discovery
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate T020 probe and generator
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w scripts/p20/t020_probe/main.go
          python3 -m py_compile scripts/p20_t020_generate_workflow.py
          go test ./scripts/p20/t020_probe ./internal/support ./services/platformapi/cmd/server
          gofmt -d scripts/p20/t020_probe/main.go | tee /tmp/t020-gofmt.diff
          test ! -s /tmp/t020-gofmt.diff
          git diff --check

      - name: Generate T020 Support workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p20_t020_generate_workflow.py
          test -f staging/p20-p0-support.yml.generated
          grep -F 'name: P20 P0 Support Timeline' staging/p20-p0-support.yml.generated
          grep -F 'P20-T009/T020 real Support live timeline' staging/p20-p0-support.yml.generated
          grep -F 'P14-T001..P14-T021' staging/p20-p0-support.yml.generated
          grep -F 'P20-T020 Support discovery probe' staging/p20-p0-support.yml.generated
          cp scripts/p20/t020_probe/main.go staging/t020_probe.go
          sha256sum staging/p20-p0-support.yml.generated staging/t020_probe.go

      - name: Persist validated T020 discovery blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ethan H.'
          git config user.email '118724895+Techshrr@users.noreply.github.com'
          git add scripts/p20/t020_probe/main.go staging/p20-p0-support.yml.generated staging/t020_probe.go
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No staging changes required.'
            exit 0
          fi
          git commit -m 'P20 T020: stage validated Support discovery blobs'
          git push origin HEAD:tmp/p20-t020-discovery
