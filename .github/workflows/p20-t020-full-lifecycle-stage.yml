name: P20 T020 Full Lifecycle Stage

on:
  push:
    branches:
      - chore/p20-t020-full-lifecycle-stage
    paths:
      - '.github/workflows/p20-t020-full-lifecycle-stage.yml'

permissions:
  contents: write

concurrency:
  group: p20-t020-full-lifecycle-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage full T020 mail and attachment lifecycle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: chore/p20-t020-full-lifecycle-stage
          fetch-depth: 0
          persist-credentials: true

      - name: Execute frozen full-lifecycle staging block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              'd6f75962ac867f6ea6adabbc78c30649887bf325:.github/workflows/p20-t020-full-lifecycle-stage.yml'
          ], text=True)
          marker = "      - name: Apply bounded full-lifecycle harness\n        shell: bash\n        run: |\n"
          assert source.count(marker) == 1
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          assert lines
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/p20-t020-full-lifecycle-stage.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p20-t020-full-lifecycle-stage.sh
