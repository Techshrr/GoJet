name: P20-T036 Performance and Bundle Isolation
on:
  push:
    branches: [develop/p20-t036-performance]
  pull_request:
    branches: [main]
    paths: ['scripts/p20/**', 'scripts/p19/**', 'frontend/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p20-t036-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify unchanged canonical guard jobs and negative cases
        run: |
          python3 scripts/p20/t036_guards.py
          python3 -m unittest discover -s scripts/p20 -p 'test_t036*.py'
      - name: Start the three required same-head producers once
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ github.ref_name }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for workflow in p04-product-shells.yml p07-browser.yml p19-website-quality.yml; do
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF" --jq '.object.sha')
            test "$current" = "$CANDIDATE_SHA"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$CANDIDATE_REF"
          done
  # BEGIN CANONICAL contract
  contract:
    needs: dispatch
    permissions:
      contents: read
    name: P20 contract freeze and whole-product baseline guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact P20 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node from repository contract
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Activate frozen pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          go version
          node --version
          pnpm --version

      - name: Validate frozen P20 product and test contract
        id: contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p20/validate_contract.py
          python3 scripts/p20/validate_contract.py | tee /tmp/p20-contract.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p20-contract.json',encoding='utf-8'))
          assert data['node']=='P20' and data['status']=='PASS' and data['errors']==[], data
          assert data['case_range']=='P20-T001..P20-T049', data
          assert data['frozen_contract_preserved'] is True, data
          assert data['review_phase'] in ('pending','signed'), data
          assert data['merge_authoritative'] is False, data
          assert len(data['contract_authority'])==40, data
          assert data['p0_workflow_steps']==15, data
          assert data['release_candidate_gate_rows']==11, data
          if data['mode']=='contract-freeze':
              assert data['implementation_commit']==data['contract_authority'], data
              assert data['implementation_authorized'] is False, data
          elif data['review_phase']=='pending':
              assert data['mode']=='verification-guard' and data['implementation_authorized'] is True, data
          else:
              assert data['mode']=='signed-review-guard' and data['implementation_authorized'] is False, data
          PY
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove current Go whole-repository baseline
        run: |
          set -euo pipefail
          go test ./...

      - name: Prove current frontend workspace baseline
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r --if-present typecheck
          pnpm -r --if-present build
          test -d frontend/apps/admin/dist
          test -d frontend/apps/docs/dist
          test -d frontend/apps/site/dist
          test -d frontend/apps/workspace/dist

      - name: Record exact-head P20 contract authority
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P20/contract-guard
          cp /tmp/p20-contract.json artifacts/v10/P20/contract-guard/contract.json
          git rev-parse HEAD > artifacts/v10/P20/contract-guard/implementation_commit.txt
          git rev-parse HEAD:artifacts/v10/P20/test-plan.json > artifacts/v10/P20/contract-guard/test_plan_blob.txt
          git rev-parse HEAD:artifacts/v10/P20/review.md > artifacts/v10/P20/contract-guard/review_blob.txt
          git rev-parse 6e628b9879eb4dddf335a324e4f4d7ae3a77cd5c:artifacts/v10/P19/review.md > artifacts/v10/P20/contract-guard/p19_signed_review_blob.txt
          git rev-parse HEAD:contracts/traceability/capability-matrix.snapshot.md > artifacts/v10/P20/contract-guard/capability_matrix_blob.txt
          git rev-parse HEAD:contracts/traceability/route-registry.snapshot.md > artifacts/v10/P20/contract-guard/route_registry_blob.txt
          git show -s --format='%H%n%P%n%T' 6e628b9879eb4dddf335a324e4f4d7ae3a77cd5c > artifacts/v10/P20/contract-guard/p19_integration_identity.txt

      - name: Upload exact-head P20 contract authority
        uses: actions/upload-artifact@v4
        with:
          name: p20-whole-product-verification-contract-${{ steps.contract.outputs.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P20/test-plan.json
            artifacts/v10/P20/review.md
            artifacts/v10/P20/contract-guard/
  # END CANONICAL contract
  # BEGIN CANONICAL candidate
  candidate:
    needs: dispatch
    permissions:
      contents: read
    name: P20 T001-T008 candidate, traceability and evidence freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact P20 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from repository contract
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node from repository contract
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Activate frozen pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Verify frozen P20 contract descendant
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 -m py_compile \
            scripts/p20/common.py \
            scripts/p20/validate_contract.py \
            scripts/p20/candidate_cases.py \
            scripts/p20/traceability_cases.py \
            scripts/p20/schema_cases.py \
            scripts/p20/build_cases.py \
            scripts/p20/authority_cases.py \
            scripts/p20/evidence_index.py \
            scripts/p20/defect_cases.py
          python3 -m unittest discover -s scripts/p20 -p 'test_release_candidate*.py'
          python3 scripts/p20/validate_contract.py > /tmp/p20-contract.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/p20-contract.json',encoding='utf-8'))
          assert data['node']=='P20' and data['status']=='PASS' and data['errors']==[], data
          assert data['implementation_commit']==os.environ['EXACT_HEAD'], data
          assert data['contract_authority']=='050fd7052d71ff77858b153abcbc466a1243af2f', data
          assert data['case_range']=='P20-T001..P20-T049', data
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/p20')
          from regression_phase import verify_execution
          scope = verify_execution(data, Path.cwd(), os.environ['EXACT_HEAD'])
          authority = Path('artifacts/v10/P20/candidate-authority')
          authority.mkdir(parents=True, exist_ok=True)
          (authority / 'execution-scope.json').write_text(json.dumps(scope, indent=2) + '\n')
          print(json.dumps(scope, sort_keys=True))
          assert data['frozen_contract_preserved'] is True and data['merge_authoritative'] is False, data
          PY

      - name: Prove exact-head Go baseline
        run: |
          set -euo pipefail
          go test ./...

      - name: Install and typecheck exact frontend workspace
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r --if-present typecheck

      - name: Run P20 T001-T004 candidate and traceability cases
        run: |
          set -euo pipefail
          python3 scripts/p20/candidate_cases.py
          python3 scripts/p20/traceability_cases.py
          python3 scripts/p20/schema_cases.py

      - name: Build frontend twice and snapshot byte inventories
        run: |
          set -euo pipefail
          cat > /tmp/p20-build-snapshot.py <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          root=Path.cwd()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files={}
          for app in ['admin','docs','site','workspace']:
              dist=root/'frontend/apps'/app/'dist'
              if not dist.is_dir():
                  raise SystemExit(f'missing dist for {app}')
              for path in sorted(p for p in dist.rglob('*') if p.is_file()):
                  files[path.relative_to(root).as_posix()]='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          Path(sys.argv[1]).write_text(json.dumps({'implementation_commit':head,'files':files},indent=2,sort_keys=True)+'\n')
          PY
          rm -rf frontend/apps/admin/dist frontend/apps/docs/dist frontend/apps/site/dist frontend/apps/workspace/dist
          pnpm -r --if-present build
          python3 /tmp/p20-build-snapshot.py /tmp/p20-build-one.json
          rm -rf frontend/apps/admin/dist frontend/apps/docs/dist frontend/apps/site/dist frontend/apps/workspace/dist
          pnpm -r --if-present build
          python3 /tmp/p20-build-snapshot.py /tmp/p20-build-two.json
          P20_BUILD_ONE=/tmp/p20-build-one.json P20_BUILD_TWO=/tmp/p20-build-two.json python3 scripts/p20/build_cases.py

      - name: Run P20 T006 live integrated-authority binding
        run: |
          set -euo pipefail
          python3 scripts/p20/authority_cases.py

      - name: Run P20 T008 defect and decision ledger
        run: |
          set -euo pipefail
          python3 scripts/p20/defect_cases.py

      - name: Run P20 T007 candidate evidence index last
        run: |
          set -euo pipefail
          python3 scripts/p20/evidence_index.py

      - name: Verify P20 T001-T008 exact-head PASS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/v10/P20')
          mapping={
            'P20-T001':root/'candidate/P20-T001.json',
            'P20-T002':root/'traceability/P20-T002.json',
            'P20-T003':root/'traceability/P20-T003.json',
            'P20-T004':root/'schema/P20-T004.json',
            'P20-T005':root/'build/P20-T005.json',
            'P20-T006':root/'authority/P20-T006.json',
            'P20-T007':root/'evidence/P20-T007.json',
            'P20-T008':root/'defects/P20-T008.json',
          }
          for cid,path in mapping.items():
              data=json.loads(path.read_text(encoding='utf-8'))
              assert (data.get('case') or data.get('case_id'))==cid, (cid,data)
              assert data['status']=='PASS' and data['errors']==[], data
              assert data['implementation_commit']==os.environ['EXACT_HEAD'], data
          PY

      - name: Record exact-head candidate authority
        run: |
          set -euo pipefail
          mkdir -p artifacts/v10/P20/candidate-authority
          printf '%s\n' "$EXACT_HEAD" > artifacts/v10/P20/candidate-authority/implementation_commit.txt
          git rev-parse HEAD:artifacts/v10/P20/test-plan.json > artifacts/v10/P20/candidate-authority/test_plan_blob.txt
          git rev-parse HEAD:artifacts/v10/P20/review.md > artifacts/v10/P20/candidate-authority/review_blob.txt
          sha256sum artifacts/v10/P20/schema/schema-catalog.json > artifacts/v10/P20/candidate-authority/schema_catalog.sha256
          sha256sum artifacts/v10/P20/build/frontend-build-inventory.json > artifacts/v10/P20/candidate-authority/frontend_build.sha256
          sha256sum artifacts/v10/P20/evidence/candidate-evidence-index.json > artifacts/v10/P20/candidate-authority/evidence_index.sha256
          sha256sum artifacts/v10/P20/defect-ledger.json > artifacts/v10/P20/candidate-authority/defect_ledger.sha256

      - name: Upload P20 T001-T008 exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v10-p20-candidate-${{ env.EXACT_HEAD }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/v10/P20/candidate/
            artifacts/v10/P20/traceability/
            artifacts/v10/P20/schema/
            artifacts/v10/P20/build/
            artifacts/v10/P20/authority/
            artifacts/v10/P20/evidence/
            artifacts/v10/P20/defects/
            artifacts/v10/P20/candidate-authority/
            artifacts/v10/P20/defect-ledger.json
  # END CANONICAL candidate
  performance:
    needs: [dispatch, contract, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Reject invalid performance evidence
        run: python3 -m unittest discover -s scripts/p20 -p 'test_t036*.py'
      - name: Collect original exact-head budget evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/p20/t036_sources.py
      - name: Recompute performance and bundle isolation
        run: python3 scripts/p20/performance_cases.py
      - name: Preserve result and original performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p20-t036-performance-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/v10/P20/performance/P20-T036.json
            artifacts/v10/P20/runtime/t036-sources/
