name: P21 Frozen Candidate Dependency Versions
on:
  push:
    branches: [develop/p21-native-release-package]
    paths:
      - 'scripts/p21-dependency-matrix/**'
      - 'artifacts/v10/P21/candidate/validation.json'
      - '.github/workflows/p21-dependency-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p21-dependency-versions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read fixed candidate identity
        id: candidate
        run: |
          python3 scripts/p21/validate_contract.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          c=json.loads(Path('artifacts/v10/P21/candidate/validation.json').read_bytes())
          print('run='+str(c['ci']['run']))
          print('artifact='+c['artifact']['name'])
          print('archive='+c['archive']['name'])
          PY
      - name: Download the existing candidate without rebuilding it
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/gojet-candidate
      - name: Prepare healthy native dependency baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-mysql redis-server clamav clamav-daemon clamav-freshclam
          sudo systemd-sysusers "$PWD/deploy/sysusers/gojet.conf"
          sudo systemd-tmpfiles --create "$PWD/deploy/tmpfiles/gojet.conf"
          sudo usermod -a -G clamav gojet
          sudo systemctl stop clamav-freshclam.service clamav-daemon.service clamav-daemon.socket
          sudo timeout 150 freshclam --stdout
          sudo sed -i '/^[[:space:]]*EnableVersionCommand[[:space:]]/d' /etc/clamav/clamd.conf
          printf '%s\n' 'EnableVersionCommand yes' | sudo tee -a /etc/clamav/clamd.conf > /dev/null
          sudo systemctl start mysql redis-server nginx php8.3-fpm clamav-daemon.socket clamav-daemon.service
          MYSQL_PWD=root mysql -h127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE gojet_p21_preflight; CREATE USER 'gojet_preflight'@'127.0.0.1' IDENTIFIED BY 'p21-ci-only'; GRANT SELECT ON gojet_p21_preflight.* TO 'gojet_preflight'@'127.0.0.1';"
          sudo timeout 60 bash -c 'until test -S /run/clamav/clamd.ctl; do sleep 1; done'
      - name: Extract signed unsupported dependency packages without installing them
        run: |
          set -euo pipefail
          sudo python3 scripts/p21-dependency-matrix/prepare_fixtures.py "$RUNNER_TEMP/gojet-wrong-dependencies"
      - name: Verify real version refusals and intact recovery on the frozen package
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p21-dependency-matrix/*.py
          mkdir -p artifacts/v10/P21/dependency-versions
          sudo env P21_DISPOSABLE_NATIVE_CI=1 python3 scripts/p21-dependency-matrix/native_versions.py "$RUNNER_TEMP/gojet-candidate/payload/${{ steps.candidate.outputs.archive }}" "$RUNNER_TEMP/gojet-wrong-dependencies" "$PWD/artifacts/v10/P21/dependency-versions/native.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gojet-v10-p21-dependency-versions-${{ github.sha }}
          retention-days: 30
          path: artifacts/v10/P21/dependency-versions/
