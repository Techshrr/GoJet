name: P21 Native Migration Execution
on:
  push:
    branches: [develop/p21-native-release-package]
    paths: ['installer/**', 'scripts/p21/php/**', 'scripts/p21/test_installer_http.py', 'scripts/p21/catalog.py', '.github/workflows/p21-native-migrations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable contract
        run: python3 scripts/p21/validate_contract.py
      - name: Prepare native PHP and MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-mysql
          sudo systemctl start mysql
          MYSQL_PWD=root mysql -h127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE gojet_p21_migrations CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE gojet_p21_partial CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER 'gojet_test'@'127.0.0.1' IDENTIFIED BY 'p21-ci-only'; GRANT ALL ON gojet_p21_migrations.* TO 'gojet_test'@'127.0.0.1'; GRANT ALL ON gojet_p21_partial.* TO 'gojet_test'@'127.0.0.1';"
      - name: Apply original catalog and reject unsafe migration states
        env:
          P21_TEST_DSN: mysql:host=127.0.0.1;dbname=gojet_p21_migrations;charset=utf8mb4
          P21_PARTIAL_DSN: mysql:host=127.0.0.1;dbname=gojet_p21_partial;charset=utf8mb4
          P21_TEST_PASSWORD: p21-ci-only
          P21_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          php8.3 -l installer/src/Migrations.php
          php8.3 -l scripts/p21/php/migrations_test.php
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/p21')
          from catalog import catalog
          Path('migration-catalog.json').write_text(json.dumps(catalog(Path('migrations'))))
          PY
          mkdir -p artifacts/v10/P21/migrations
          P21_MIGRATION_ROOT="$PWD" php8.3 scripts/p21/php/migrations_test.php | tee artifacts/v10/P21/migrations/native.json
      - name: Back up and restore actual native database in isolation
        env:
          P21_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          MYSQL_PWD=root mysql -h127.0.0.1 -uroot -e "CREATE DATABASE gojet_p21_backup CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE gojet_p21_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER 'gojet_backup_limited'@'127.0.0.1' IDENTIFIED BY 'p21-limited-only'; GRANT SELECT ON gojet_p21_backup.* TO 'gojet_backup_limited'@'127.0.0.1';"
          php8.3 -l installer/src/DatabaseBackup.php
          php8.3 -l scripts/p21/php/backup_test.php
          sudo env P21_BACKUP_PASSWORD=root P21_MIGRATION_ROOT="$PWD" P21_SOURCE="$P21_SOURCE" php8.3 scripts/p21/php/backup_test.php | tee artifacts/v10/P21/migrations/backup-restore.json
      - name: Verify upgrade restore and filesystem transaction together
        run: |
          set -euo pipefail
          sudo env P21_UPGRADE_TEST_PASSWORD=root php8.3 scripts/p21/php/upgrade_database_test.php | tee artifacts/v10/P21/migrations/upgrade-database.json
          sudo php8.3 scripts/p21/php/upgrade_filesystem_test.php | tee artifacts/v10/P21/migrations/upgrade-filesystem.json
      - name: Verify private durable installer state
        run: |
          set -euo pipefail
          php8.3 -l installer/src/InstallState.php
          php8.3 -l scripts/p21/php/install_state_test.php
          php8.3 scripts/p21/php/install_state_test.php | tee artifacts/v10/P21/migrations/installer-state.json
      - name: Verify Installer HTTP access boundary
        run: |
          set -euo pipefail
          php8.3 -l installer/public/index.php
          php8.3 -l installer/src/HttpAccess.php
          PHP_BIN=php8.3 python3 scripts/p21/test_installer_http.py | tee artifacts/v10/P21/migrations/installer-http.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gojet-v10-p21-migrations-${{ github.sha }}
          path: artifacts/v10/P21/migrations/
          retention-days: 30
