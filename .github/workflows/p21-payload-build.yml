name: P21 Native Payload Build
on:
  push:
    branches: [develop/p21-native-release-package]
    paths:
      - 'scripts/p21/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'services/**'
      - 'frontend/**'
      - 'installer/**'
      - 'deploy/systemd/**'
      - 'deploy/sysusers/**'
      - 'deploy/tmpfiles/**'
      - 'deploy/logrotate/**'
      - 'deploy/nginx/**'
      - 'migrations/**'
      - '.github/workflows/p21-payload-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p21-payload-${{ github.ref }}
  cancel-in-progress: false
jobs:
  executor-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unprivileged probes retain identity and privilege restrictions
        run: sudo python3 scripts/p21/native_executor_identity_test.py
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify contract and archive rejection tests
        run: |
          python3 scripts/p21/validate_contract.py
          python3 -m unittest discover -s scripts/p21 -p 'test_*.py'
      - name: Compile and verify native executables
        env:
          P21_KEEP_BINARIES: '1'
        run: python3 scripts/p21/verify_build.py
      - name: Compile static frontend from frozen lock
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
      - name: Prepare real browser submission tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/p21-browsers
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Assemble and independently read back reproducible payload
        run: python3 scripts/p21/build_payload.py
      - name: Verify extracted release with target-host PHP preflight
        run: |
          set -euo pipefail
          php8.3 -l installer/src/PackageIntegrity.php
          php8.3 -l installer/bin/verify-package.php
          sudo python3 scripts/p21/native_package_integrity_test.py artifacts/v10/P21/payload/gojet-10.0.0-rc.1-linux-amd64-payload.tar.gz "$GITHUB_SHA" | tee artifacts/v10/P21/payload/target-integrity.json
      - name: Prepare native dependencies for aggregate preflight
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-mysql redis-server clamav clamav-daemon clamav-freshclam
          sudo systemd-sysusers "$PWD/deploy/sysusers/gojet.conf"
          sudo usermod -a -G clamav gojet
          sudo systemctl stop clamav-freshclam.service clamav-daemon.service clamav-daemon.socket
          sudo timeout 150 freshclam --stdout
          # Health authority requires engine/signature metadata; no admin commands.
          sudo sed -i '/^[[:space:]]*EnableVersionCommand[[:space:]]/d' /etc/clamav/clamd.conf
          printf '%s\n' 'EnableVersionCommand yes' | sudo tee -a /etc/clamav/clamd.conf > /dev/null
          sudo systemctl start mysql redis-server nginx php8.3-fpm clamav-daemon.socket clamav-daemon.service
          MYSQL_PWD=root mysql -h127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE gojet_p21_preflight; CREATE USER 'gojet_preflight'@'127.0.0.1' IDENTIFIED BY 'p21-ci-only'; GRANT SELECT ON gojet_p21_preflight.* TO 'gojet_preflight'@'127.0.0.1';"
          sudo timeout 60 bash -c 'until test -S /run/clamav/clamd.ctl; do sleep 1; done'
      - name: Verify four compiled static apps through native Nginx
        run: |
          set -euo pipefail
          sudo python3 scripts/p21/native_static_routes_test.py artifacts/v10/P21/payload/gojet-10.0.0-rc.1-linux-amd64-payload.tar.gz "$GITHUB_SHA" | tee artifacts/v10/P21/payload/static-routing.json
      - name: Verify aggregate native preflight and real dependency failures
        run: |
          set -euo pipefail
          php8.3 -l installer/src/UnprivilegedProbe.php
          php8.3 -l installer/src/DependencyPreflight.php
          php8.3 -l installer/bin/preflight.php
          sudo python3 scripts/p21/native_dependency_preflight_test.py artifacts/v10/P21/payload/gojet-10.0.0-rc.1-linux-amd64-payload.tar.gz "$GITHUB_SHA" | tee artifacts/v10/P21/payload/dependency-preflight.json
      - name: Verify sealed preparation through actual native database bootstrap
        run: |
          set -euo pipefail
          php8.3 -l installer/src/ApplyRequest.php
          php8.3 -l installer/src/PreflightSnapshot.php
          php8.3 -l installer/src/ApplyProgress.php
          php8.3 -l installer/bin/refresh-web-preflight.php
          php8.3 -l installer/bin/render-web-preflight-schedule.php
          php8.3 -l installer/src/PreflightScheduleInstallation.php
          php8.3 -l installer/bin/install-web-preflight-schedule.php
          php8.3 -l installer/bin/render-web-apply-schedule.php
          php8.3 -l installer/bin/install-web-apply-schedule.php
          php8.3 -l installer/src/WebInstallationApply.php
          php8.3 -l installer/bin/provision-web-apply.php
          php8.3 -l installer/bin/run-web-apply.php
          php8.3 -l installer/src/InstallationApply.php
          php8.3 -l installer/bin/apply-installation.php
          php8.3 -l installer/src/InstallationCompletion.php
          php8.3 -l installer/bin/check-installation.php
          php8.3 -l installer/bin/complete-installation.php
          php8.3 -l installer/src/SiteActivation.php
          php8.3 -l installer/bin/activate-site.php
          php8.3 -l installer/bin/recover-site.php
          php8.3 -l installer/src/ServiceActivation.php
          php8.3 -l installer/bin/activate-services.php
          php8.3 -l installer/bin/recover-services.php
          php8.3 -l installer/src/InstallationPreparation.php
          php8.3 -l installer/src/WebConfigurationPreparation.php
          php8.3 -l installer/bin/run-web-preparation.php
          php8.3 -l installer/bin/recover-web-preparation.php
          php8.3 -l installer/src/WebConfigurationRestart.php
          php8.3 -l installer/bin/restart-web-configuration.php
          php8.3 -l installer/bin/render-web-preparation-schedule.php
          php8.3 -l installer/bin/install-web-preparation-schedule.php
          php8.3 -l installer/bin/prepare-installation.php
          php8.3 -l installer/bin/run-prepared-data.php
          MYSQL_PWD=root mysql -h127.0.0.1 -uroot -e "CREATE DATABASE gojet_p21_applied; CREATE DATABASE gojet_p21_prepared; CREATE USER 'gojet_prepared'@'127.0.0.1' IDENTIFIED BY 'p21-ci-only'; GRANT ALL ON gojet_p21_prepared.* TO 'gojet_prepared'@'127.0.0.1'; GRANT ALL ON gojet_p21_applied.* TO 'gojet_prepared'@'127.0.0.1';"
          sudo env P21_NODE="$(command -v node)" PLAYWRIGHT_BROWSERS_PATH=/opt/p21-browsers python3 scripts/p21/native_installation_preparation_test.py artifacts/v10/P21/payload/gojet-10.0.0-rc.1-linux-amd64-payload.tar.gz "$GITHUB_SHA" | tee artifacts/v10/P21/payload/installation-preparation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gojet-v10-p21-payload-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/v10/P21/payload/
            artifacts/v10/P21/build/native-build.json
            artifacts/v10/P21/build/go-test.log
