name: P23 Panel Web Installer
on:
  push:
    branches: [feat/p23-panel-web-installer]
concurrency:
  group: panel-installer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  panel-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Cancel superseded validation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/Techshrr/GoJet/actions/workflows/p23-panel-installer.yml/runs?branch=feat%2Fp23-panel-web-installer&per_page=30' --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id' > /tmp/panel-runs.txt
          while read -r run_id; do
            if [ "$run_id" -lt "$GITHUB_RUN_ID" ]; then gh api --method POST "repos/Techshrr/GoJet/actions/runs/$run_id/cancel" || true; fi
          done < /tmp/panel-runs.txt
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Contract checks
        run: |
          python3 -m unittest discover -s panel/tests -p 'test_*.py'
          php8.3 -l panel/bridge.php
          php8.3 -l panel/refresh_mail_templates.php
          python3 -m py_compile native/*.py panel/*.py
          node panel/tests/form_submission.mjs
      - name: Build deployable image
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" --progress=plain -f panel/Dockerfile -t linketic-panel:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Browser runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright-core install --with-deps chromium
      - name: Start isolated deployment and external protocol fixtures
        run: |
          mkdir -p artifacts/panel
          echo "127.0.0.1 www.linketic.test" | sudo tee -a /etc/hosts > /dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=panel-ci' -addext 'subjectAltName=DNS:www.linketic.test,DNS:webrisk.googleapis.com,DNS:challenges.cloudflare.com,DNS:mail.fixture' -keyout panel/tests/key.pem -out panel/tests/cert.pem
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          certutil -A -d "sql:$HOME/.pki/nssdb" -n linketic-ci -t 'C,,' -i panel/tests/cert.pem
          echo "NODE_EXTRA_CA_CERTS=$PWD/panel/tests/cert.pem" >> "$GITHUB_ENV"
          docker run -d --name linketic-ci -p 127.0.0.1:18080:8088 -p 127.0.0.1:11443:11443 --add-host webrisk.googleapis.com:127.0.0.1 --add-host challenges.cloudflare.com:127.0.0.1 --add-host mail.fixture:127.0.0.1 -e SITE_URL=https://www.linketic.test:11443 -e INSTALL_ACCESS_CODE=ci-panel-access-code-1234567890 -v "$PWD/panel/tests:/test:ro" -v panel-app:/var/lib/linketic -v panel-db:/var/lib/mysql -v panel-redis:/var/lib/redis -v panel-av:/var/lib/clamav linketic-panel:ci
          for i in $(seq 1 90); do if curl -fsS -H 'Host: www.linketic.test' http://127.0.0.1:18080/install/ > /dev/null; then break; fi; sleep 2; done
          docker exec linketic-ci cp /test/cert.pem /usr/local/share/ca-certificates/panel-ci.crt
          docker exec linketic-ci update-ca-certificates
          docker exec -d linketic-ci sh -c 'python3 /test/fixtures.py > /tmp/fixtures.log 2>&1'
          for i in $(seq 1 30); do if curl --noproxy '*' -kfsS --resolve www.linketic.test:11443:127.0.0.1 https://www.linketic.test:11443/install/ > /dev/null; then break; fi; sleep 1; done
          curl --noproxy '*' -kfsS --resolve www.linketic.test:11443:127.0.0.1 https://www.linketic.test:11443/install/ > /dev/null
      - name: Real browser installation and admin acceptance
        run: node panel/tests/browser.mjs
      - name: Customer mail, recovery and OAuth configuration
        run: node panel/tests/customer.mjs
      - name: Restart persistence
        run: |
          docker restart linketic-ci
          for i in $(seq 1 60); do if docker exec linketic-ci supervisorctl status | python3 -c 'import sys; rows=sys.stdin.read().splitlines(); names=["platformapi","redirectengine","analyticsworker","analyticsreconciler","mailworker","fileworker","operationsmonitor","logreceiver","webrisk"]; sys.exit(not all(any(r.startswith(n+" ") and "RUNNING" in r for r in rows) for n in names))'; then break; fi; sleep 2; done
          docker exec linketic-ci python3 -c 'import json; from pathlib import Path; assert json.loads(Path("/var/lib/linketic/private/installed.json").read_text())["schema"]=="gojet.panel-install.v1"'
          docker exec linketic-ci supervisorctl status > artifacts/panel/processes-after-restart.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('artifacts/panel/processes-after-restart.txt').read_text()
          for service in ['platformapi','redirectengine','analyticsworker','analyticsreconciler','mailworker','fileworker','operationsmonitor','logreceiver','webrisk']:
              assert any(line.startswith(service+' ') and 'RUNNING' in line for line in text.splitlines()), service
          PY
      - name: Upgrade existing panel.2 with pending customer account
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 panel/tests/upgrade.py
      - name: Build Docker-free systemd package
        run: python3 native/package.py --output "$RUNNER_TEMP/linketic-native-delivery"
      - name: Native installation with Docker stopped
        run: python3 native/acceptance.py
      - name: Seal native acceptance into delivery archive
        run: python3 native/package.py --finalize --output "$RUNNER_TEMP/linketic-native-delivery"
      - name: Package tested image and publish panel prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 panel/package.py --output "$RUNNER_TEMP/linketic-delivery"
          gh release create v10.0.0-rc.2-panel.4 --target "$GITHUB_SHA" --title 'Linketic 10.0.0-rc.2 · Panel Web Installer 4' --prerelease --notes-file panel/RELEASE-NOTES.md "$RUNNER_TEMP/linketic-delivery/Linketic-Panel-10.0.0-rc.2-panel.4-linux-amd64.zip" "$RUNNER_TEMP/linketic-delivery/Linketic-Panel-10.0.0-rc.2-panel.4-linux-amd64.zip.sha256" "$RUNNER_TEMP/linketic-native-delivery/Linketic-Native-10.0.0-rc.2-panel.4-linux-amd64.zip" "$RUNNER_TEMP/linketic-native-delivery/Linketic-Native-10.0.0-rc.2-panel.4-linux-amd64.zip.sha256"
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p artifacts/panel
          sudo journalctl -u linketic.service --no-pager > artifacts/panel/native-service.log 2>&1 || true
          sudo sh -c 'for f in /var/lib/linketic-native/app/private/logs/*.log; do [ -f "$f" ] || continue; printf "\\n%s\\n" "$(basename "$f")"; tail -n 80 "$f"; done' > artifacts/panel/native-processes.log 2>&1 || true
          sudo sh -c 'for f in /opt/linketic-native/runtime/var/log/mysql/*.log /var/lib/linketic-native/mysql/*.err; do [ -f "$f" ] || continue; printf "\\n%s\\n" "$(basename "$f")"; tail -n 80 "$f"; done' > artifacts/panel/native-mysql.log 2>&1 || true
          cat artifacts/panel/native-service.log artifacts/panel/native-processes.log artifacts/panel/native-mysql.log
          docker logs linketic-ci > artifacts/panel/container.log 2>&1 || true
          docker exec linketic-ci cat /tmp/fixtures.log > artifacts/panel/fixtures.log || true
          docker exec linketic-ci cat /tmp/fixture-proxy.log > artifacts/panel/fixture-proxy.log || true
          docker exec linketic-ci cat /var/lib/linketic/status/progress.json > artifacts/panel/progress.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-installer-${{ github.sha }}
          path: artifacts/panel
          retention-days: 14
