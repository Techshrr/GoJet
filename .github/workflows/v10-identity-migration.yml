name: One-time GoJet V10 identity migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize project identity to GoJet V10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          targets = [root / 'README.md', *sorted((root / 'specifications').glob('*.md'))]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = text.replace('GoJet V5', 'GoJet V10')
              text = text.replace('GJ-V5-', 'GJ-V10-')
              text = text.replace('GoJet_V5_', 'GoJet_V10_')
              text = re.sub(r'\bV5\b', 'V10', text)
              path.write_text(text, encoding='utf-8')

          specs = root / 'specifications'
          for path in list(specs.glob('*V5*.md')):
              path.rename(path.with_name(path.name.replace('V5', 'V10')))

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          anchor = 'GoJet V10 is a greenfield short-link and resource platform implemented from specification first.\n'
          identity = ('\nGoJet V10 is an independent greenfield product. The V10 designation is a standalone product identity; '
                      'no earlier GoJet release, repository, branch, commit, migration, generated artifact, runtime configuration, '
                      'or implementation is a dependency, migration source, compatibility baseline, or normative evidence.\n')
          if anchor in text and 'standalone product identity' not in text:
              text = text.replace(anchor, anchor + identity, 1)
          readme.write_text(text, encoding='utf-8')

          master = specs / 'GoJet_V10_MASTER_PLAN_OPTIMIZED.md'
          text = master.read_text(encoding='utf-8')
          marker = '**Production Docker/Compose/Node runtime:** PROHIBITED\n'
          identity_rule = ('**Product identity rule:** `GoJet V10` is an independent Greenfield product identity. No earlier GoJet release, '
                           'repository, branch, commit, migration, generated artifact, runtime configuration, or implementation may be used '
                           'as an upgrade source, migration source, compatibility baseline, implementation dependency, or normative evidence.\n')
          if marker in text and '**Product identity rule:**' not in text:
              text = text.replace(marker, marker + identity_rule, 1)
          master.write_text(text, encoding='utf-8')

          residual = []
          for path in [root / 'README.md', *sorted(specs.glob('*.md'))]:
              content = path.read_text(encoding='utf-8')
              if re.search(r'(?<![A-Za-z0-9])V5(?![A-Za-z0-9])|GoJet_V5_|GJ-V5-', content):
                  residual.append(str(path))
              if 'V5' in path.name:
                  residual.append(str(path))
          if residual:
              raise SystemExit('Residual V5 identity detected: ' + ', '.join(sorted(set(residual))))
          PY

      - name: Commit normalized V10 specification identity
        shell: bash
        run: |
          rm -f .github/workflows/v10-identity-migration.yml
          git config user.name "GoJet Specification Migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: normalize GoJet project identity to V10"
          git push origin HEAD:main
