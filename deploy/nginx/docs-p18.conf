# P18 Docs static-serving fragment.
# Include inside the production HTTPS server after setting root to the built Docs directory.
# P18 proves route/status/static behavior only; P22 retains owner-controlled production validation.

# The P18 CI fixture intentionally has no global mime.types include. Keep the
# static Docs asset contract explicit here so module scripts/Pagefind WASM are
# served with browser-safe media types in both the fixture and a minimal Nginx host.
types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/wasm wasm;
    application/json json;
    application/xml xml;
    image/svg+xml svg;
}

location = /docs/en/legacy-api {
    return 410;
}

location = /docs/zh-CN/legacy-api {
    return 410;
}

location ~ ^/docs/(en|zh-CN)/search$ {
    if ($arg_q = "") { return 400; }
    if ($arg_q ~ "^.{257,}$") { return 400; }
    rewrite ^/docs/(.*)$ /$1 break;
    try_files $uri/index.html $uri =404;
}

location /docs/ {
    rewrite ^/docs/(.*)$ /$1 break;
    try_files $uri/index.html $uri =404;
}
