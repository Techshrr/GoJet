# P18 Docs static-serving fragment.
# Include inside the production HTTPS server after setting root to the built Docs directory.
# P18 proves route/status/static behavior only; P22 retains owner-controlled production validation.

location = /docs/en/legacy-api {
    return 410;
}

location = /docs/zh-CN/legacy-api {
    return 410;
}

location /docs/ {
    rewrite ^/docs/(.*)$ /$1 break;
    try_files $uri/index.html $uri =404;
}
