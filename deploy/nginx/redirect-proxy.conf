# Include with static and platform fragments; enable GOJET_REDIRECT_TRUST_LOOPBACK_PROXY=1.
# Keep redirectengine loopback-only; never expose internal health on public ingress.
location = /healthz { return 404; }
location / {
    if ($uri !~ "^/[A-Za-z0-9_-]{1,64}$") { return 404; }
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_cache off;
    proxy_intercept_errors off;
    access_log off;
}
