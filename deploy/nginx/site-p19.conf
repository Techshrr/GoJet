# P19 Website static-serving fragment. Include inside the public Website server block.
# Production Website acquisition pages are pre-rendered; Node/SSR/PM2 is not a serving dependency.

location = / {
    try_files /index.html =404;
}

location = /zh-CN/ {
    try_files /zh-CN/index.html =404;
}

# Frozen withdrawn dynamic-guide fixture used to prove the IA 410 boundary.
location = /guides/legacy-deployment {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 410;
}
location = /zh-CN/guides/legacy-deployment {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 410;
}

# Exact Website registry families. Canonical paths have no trailing slash except roots above.
location ~ ^/(?:zh-CN/)?(?:products(?:/(?:links|qr-codes|files|text-sharing|link-in-bio|analytics|smart-routing|custom-domains))?|solutions(?:/(?:marketing|creators|teams|developers))?|developers|pricing|security|guides(?:/[a-z0-9-]+)?|about|contact|legal/(?:terms|privacy|acceptable-use|abuse))$ {
    try_files $uri.html =404;
}
