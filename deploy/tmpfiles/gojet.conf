# Root owns immutable releases and service configuration; PHP cannot write them.
d /opt/gojet 0755 root root -
d /opt/gojet/releases 0755 root root -
d /etc/gojet 0700 root root -
d /var/lib/gojet 0750 root gojet -
d /var/lib/gojet/files 0700 gojet gojet -
# /run/gojet-log belongs exclusively to logreceiver RuntimeDirectory lifecycle.
# Readable by Installer PHP but writable only by the root apply worker.
d /var/lib/gojet-installer-authority 0755 root root -
# Nginx master creates/reopens file logs; workers cannot replace directory entries.
d /var/log/gojet 0750 root adm -
d /var/log/gojet/nginx 0750 root adm -
