<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc" data-gojet-reference="jet-path" data-authority="GJ-V10-DS-GREENFIELD-2026-08-20">
  <title id="title">GoJet Jet Path reference</title><desc id="desc">Reference composition showing path, inactive and active nodes, a route split and an event pulse. Motion stops under reduced-motion preference without removing state information.</desc>
  <defs><linearGradient id="route-gradient" x1="90" y1="100" x2="700" y2="320" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#38BDF8"/></linearGradient></defs>
  <style>.jet-pulse{offset-path:path("M100 250 C220 120 330 120 420 215 S610 360 700 210");animation:jet-path-pulse 6000ms linear infinite}@keyframes jet-path-pulse{from{offset-distance:0%}to{offset-distance:100%}}@media (prefers-reduced-motion: reduce){.jet-pulse{animation:none;offset-distance:100%;opacity:.85;transition:opacity 120ms linear}}</style>
  <rect width="800" height="420" rx="24" fill="#F7F9FC"/>
  <path data-jet-element="path" d="M100 250C220 120 330 120 420 215S610 360 700 210" fill="none" stroke="url(#route-gradient)" stroke-width="8" stroke-linecap="round"/>
  <path data-jet-element="split" d="M420 215C490 150 555 130 630 155" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 12"/>
  <circle data-jet-element="node" cx="100" cy="250" r="12" fill="#F7F9FC" stroke="#2563EB" stroke-width="6"/><circle data-jet-element="node" cx="420" cy="215" r="13" fill="#06B6D4" stroke="#F7F9FC" stroke-width="5"/><circle data-jet-element="node" cx="700" cy="210" r="12" fill="#38BDF8" stroke="#F7F9FC" stroke-width="5"/><circle data-jet-element="node" cx="630" cy="155" r="11" fill="#F7F9FC" stroke="#06B6D4" stroke-width="5"/><circle data-jet-element="pulse" class="jet-pulse" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="4"/>
  <text x="100" y="55" fill="#0F172A" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700">Jet Path reference</text><text x="100" y="86" fill="#475569" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16">path · node · split · pulse</text>
</svg>
